parameters:
  - name: name
    type: string
  - name: path
    type: string
  - name: hasBuild
    type: boolean
    default: false
  - name: hasLint
    type: boolean
    default: true
  - name: hasTests
    type: boolean
    default: false
  - name: nodeVersion
    type: string
    default: '22.x'
  - name: trivyVersion
    type: string
    default: '0.74.0'

steps:

  # Full git history is required for SonarCloud blame / SCM analysis.
  - checkout: self
    fetchDepth: 0
    displayName: 'Checkout (full depth for SCM blame)'


  - task: UseNode@1
    displayName: 'Node.js ${{ parameters.nodeVersion }} — ${{ parameters.name }}'
    inputs:
      version: '${{ parameters.nodeVersion }}'

  - task: Cache@2
    displayName: 'Cache npm — ${{ parameters.name }}'
    inputs:
      key: 'npm | "$(Agent.OS)" | ${{ parameters.path }}/package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: '$(Pipeline.Workspace)/.npm'

  - script: |
      set -euo pipefail
      npm config set cache "$(Pipeline.Workspace)/.npm"
      cd ${{ parameters.path }}
      npm ci --no-audit --no-fund
    displayName: 'npm ci — ${{ parameters.name }}'

  - ${{ if eq(parameters.hasLint, true) }}:
      - script: |
          set -euo pipefail
          cd ${{ parameters.path }}
          npm run lint
        displayName: 'Lint — ${{ parameters.name }}'

  - ${{ if eq(parameters.hasTests, true) }}:
      - script: |
          set -euo pipefail
          cd ${{ parameters.path }}
          npm test
        displayName: 'Tests — ${{ parameters.name }}'

  - script: |
      set -euo pipefail
      cd ${{ parameters.path }}
      npm audit --audit-level=high --omit=dev
    displayName: 'npm audit (high+) — ${{ parameters.name }}'

  - ${{ if eq(parameters.hasBuild, true) }}:
      - script: |
          set -euo pipefail
          cd ${{ parameters.path }}
          npm run build
        displayName: 'Production build — ${{ parameters.name }}'

  - task: Cache@2
    displayName: 'Cache Trivy DB'
    inputs:
      key: 'trivy-db | "$(Agent.OS)" | "${{ parameters.trivyVersion }}" | "$(Build.BuildId)"'
      restoreKeys: |
        trivy-db | "$(Agent.OS)" | "${{ parameters.trivyVersion }}"
        trivy-db | "$(Agent.OS)"
      path: '$(Pipeline.Workspace)/.trivy-cache'

  - script: |
      set -euo pipefail
      if ! command -v trivy >/dev/null 2>&1; then
        curl -fsSL -o /tmp/trivy.deb \
          "https://github.com/aquasecurity/trivy/releases/download/v${{ parameters.trivyVersion }}/trivy_${{ parameters.trivyVersion }}_Linux-64bit.deb"
        sudo dpkg -i /tmp/trivy.deb
      fi
      trivy --version

      trivy fs \
        --cache-dir "$(Pipeline.Workspace)/.trivy-cache" \
        --scanners vuln,secret,misconfig \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        --format table \
        ${{ parameters.path }}
    displayName: 'Trivy fs — ${{ parameters.name }}'

  # SonarCloud (own project per service, auth via sonarcloud-homeease service connection, config from sonar-project.properties).
  - task: SonarCloudPrepare@4
    displayName: 'SonarCloud prepare — ${{ parameters.name }}'
    inputs:
      SonarCloud: 'sonarcloud-homeease'
      organization: 'srinidhisanjeevi'
      scannerMode: 'CLI'
      configMode: 'file'
      configFile: '${{ parameters.path }}/sonar-project.properties'

  - task: SonarCloudAnalyze@4
    displayName: 'SonarCloud analyze — ${{ parameters.name }}'

  - task: SonarCloudPublish@4
    displayName: 'SonarCloud Quality Gate — ${{ parameters.name }}'
    inputs:
      pollingTimeoutSec: '300'