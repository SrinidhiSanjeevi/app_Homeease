# ============================================================
# Reusable validation steps for one Node service.
#
# Order matters: cheapest and most likely to fail goes first, so a
# broken lint doesn't wait 4 minutes behind a test suite.
# ============================================================

parameters:
  - name: name
    type: string
  - name: path
    type: string
  - name: hasTests
    type: boolean
    default: true
  - name: hasLint
    type: boolean
    default: true
  - name: sonarProjectKey
    type: string
  - name: sonarHostUrl
    type: string
  - name: nodeVersion
    type: string
    default: '22.x'
  - name: trivyVersion
    type: string
    default: '0.74.0'

steps:

  - task: UseNode@1
    displayName: 'Node.js ${{ parameters.nodeVersion }} — ${{ parameters.name }}'
    inputs:
      version: '${{ parameters.nodeVersion }}'

  # Cache the npm download cache, not node_modules. Caching node_modules
  # can restore a tree that doesn't match the lockfile after a dependency
  # bump; ~/.npm is content-addressed and always safe.
  - task: Cache@2
    displayName: 'Cache npm — ${{ parameters.name }}'
    inputs:
      key: 'npm | "$(Agent.OS)" | ${{ parameters.path }}/package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: '$(Pipeline.Workspace)/.npm'

  - script: |
      set -euo pipefail
      npm config set cache "$(Pipeline.Workspace)/.npm"
      cd ${{ parameters.path }}
      npm ci --no-audit --no-fund
    displayName: 'npm ci — ${{ parameters.name }}'

  - ${{ if eq(parameters.hasLint, true) }}:
      - script: |
          set -euo pipefail
          cd ${{ parameters.path }}
          npm run lint
        displayName: 'Lint — ${{ parameters.name }}'

  # npm audit reads the lockfile and knows about advisories Trivy's
  # database may lag on. Running both is deliberate — they disagree.
  - script: |
      set -euo pipefail
      cd ${{ parameters.path }}
      npm audit --audit-level=high --omit=dev
    displayName: 'npm audit (high+) — ${{ parameters.name }}'

  - ${{ if eq(parameters.hasTests, true) }}:
      - script: |
          set -euo pipefail
          cd ${{ parameters.path }}
          npm run test:coverage -- --ci --reporters=default --reporters=jest-junit
        displayName: 'Test + coverage — ${{ parameters.name }}'
        env:
          JEST_JUNIT_OUTPUT_DIR: '$(Build.ArtifactStagingDirectory)/${{ parameters.name }}'
          JEST_JUNIT_OUTPUT_NAME: 'junit.xml'

      - task: PublishTestResults@2
        displayName: 'Publish test results — ${{ parameters.name }}'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '$(Build.ArtifactStagingDirectory)/${{ parameters.name }}/junit.xml'
          testRunTitle: '${{ parameters.name }}'
          failTaskOnFailedTests: true

      - task: PublishCodeCoverageResults@2
        displayName: 'Publish coverage — ${{ parameters.name }}'
        condition: succeededOrFailed()
        inputs:
          summaryFileLocation: '${{ parameters.path }}/coverage/cobertura-coverage.xml'
          pathToSources: '${{ parameters.path }}'

  # Frontend builds instead of testing. It still has to compile.
  - ${{ if eq(parameters.hasTests, false) }}:
      - script: |
          set -euo pipefail
          cd ${{ parameters.path }}
          npm run build
        displayName: 'Production build — ${{ parameters.name }}'

  # ──────────────────────────────────────────────────────────
  # SCA on the source tree.
  #
  # This is NOT the same as the image scan in the Package stage:
  # here Trivy sees devDependencies and the lockfile; there it sees
  # only what shipped. Both matter — a vulnerable build-time dep is
  # a supply-chain risk even if it never reaches production.
  # ──────────────────────────────────────────────────────────

  - task: Cache@2
    displayName: 'Cache Trivy DB'
    inputs:
      key: 'trivy-db | "$(Agent.OS)" | "${{ parameters.trivyVersion }}" | "$(Build.BuildId)"'
      restoreKeys: |
        trivy-db | "$(Agent.OS)" | "${{ parameters.trivyVersion }}"
        trivy-db | "$(Agent.OS)"
      path: '$(Pipeline.Workspace)/.trivy-cache'

  - script: |
      set -euo pipefail
      if ! command -v trivy >/dev/null 2>&1; then
        curl -fsSL -o /tmp/trivy.deb \
          "https://github.com/aquasecurity/trivy/releases/download/v${{ parameters.trivyVersion }}/trivy_${{ parameters.trivyVersion }}_Linux-64bit.deb"
        sudo dpkg -i /tmp/trivy.deb
      fi
      trivy --version

      trivy fs \
        --cache-dir "$(Pipeline.Workspace)/.trivy-cache" \
        --scanners vuln,secret,misconfig \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        --format table \
        ${{ parameters.path }}
    displayName: 'Trivy fs — ${{ parameters.name }}'

  # ──────────────────────────────────────────────────────────
  # SonarQube — SonarQubePrepare@8 resolves the sonarqube-homeease
  # service connection ONLY (host URL + token); SonarQubeAnalyze@8 is
  # never invoked. That task's bundled scanner is what silently
  # defaulted to SonarQube CLOUD in earlier attempts (its newer
  # "Scanner Engine" bootstrap auto-detects Azure DevOps as a CI
  # vendor and injects sonar.branch.name, which then breaks on
  # Community Build — "Developer Edition required"). Extracting just
  # the two values we need from what Prepare resolves, then handing
  # them to our own pinned scanner-cli 5.0.1.3006 invocation, gets
  # service-connection-based auth without going anywhere near the
  # component that caused the fallback.
  #
  # No homeease-ci SONAR_TOKEN dependency: the token comes from the
  # service connection via Prepare, never from the variable group.
  # ──────────────────────────────────────────────────────────

  - task: SonarQubePrepare@8
    displayName: 'Sonar prepare (resolve connection only) — ${{ parameters.name }}'
    inputs:
      SonarQube: 'sonarqube-homeease'
      scannerMode: 'CLI'
      configMode: 'file'
      configFile: '${{ parameters.path }}/sonar-project.properties'

  - script: |
      set -euo pipefail
      if [ -z "${SONARQUBE_SCANNER_PARAMS:-}" ]; then
        echo "##vso[task.logissue type=error]SONARQUBE_SCANNER_PARAMS is empty — Sonar prepare did not resolve sonarqube-homeease."
        exit 1
      fi

      HOST_URL=$(echo "$SONARQUBE_SCANNER_PARAMS" | jq -r '."sonar.host.url" // empty')
      TOKEN=$(echo "$SONARQUBE_SCANNER_PARAMS" | jq -r '."sonar.token" // ."sonar.login" // empty')

      if [ -z "$HOST_URL" ] || [ -z "$TOKEN" ]; then
        echo "##vso[task.logissue type=error]Service connection resolved, but sonar.host.url/token were missing from the result."
        exit 1
      fi

      echo "Resolved sonar.host.url from service connection: $HOST_URL"
      echo "Resolved token from service connection: present"

      echo "##vso[task.setvariable variable=RESOLVED_SONAR_HOST_URL]$HOST_URL"
      echo "##vso[task.setvariable variable=RESOLVED_SONAR_TOKEN;issecret=true]$TOKEN"
    displayName: 'Extract host/token from service connection — ${{ parameters.name }}'
    env:
      SONARQUBE_SCANNER_PARAMS: $(SONARQUBE_SCANNER_PARAMS)

  - script: |
      set -euo pipefail
      if ! command -v sonar-scanner >/dev/null 2>&1; then
        curl -fsSL -o /tmp/sonar-scanner.zip \
          "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip"
        unzip -q /tmp/sonar-scanner.zip -d /tmp
        sudo mv /tmp/sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
        sudo ln -sf /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner
      fi
      sonar-scanner --version

      # SonarQubePrepare still embeds sonar.branch.name inside
      # SONARQUBE_SCANNER_PARAMS. Community Build rejects branch
      # analysis ("Developer Edition or above is required"), so make
      # sure this scanner invocation can't see that variable at all —
      # only the resolved host/token below are used.
      unset SONARQUBE_SCANNER_PARAMS

      cd "$(Build.SourcesDirectory)/${{ parameters.path }}"

      sonar-scanner \
        -Dsonar.host.url="$RESOLVED_SONAR_HOST_URL" \
        -Dsonar.token="$RESOLVED_SONAR_TOKEN"
    displayName: 'Sonar scan — ${{ parameters.name }}'
    env:
      RESOLVED_SONAR_TOKEN: $(RESOLVED_SONAR_TOKEN)
      RESOLVED_SONAR_HOST_URL: $(RESOLVED_SONAR_HOST_URL)

  # ──────────────────────────────────────────────────────────
  # Quality Gate — polls SonarQube's own REST API directly, using the
  # SAME token resolved from the sonarqube-homeease service connection
  # above (RESOLVED_SONAR_TOKEN) — no homeease-ci SONAR_TOKEN involved
  # anywhere in this file anymore.
  #
  # main branch: a failing gate fails the job — same effective
  # behavior as SonarQubePublish@8's default. Any other branch: warn
  # only, don't fail the build — the check always runs either way,
  # only the failure severity differs, so PR feedback isn't lost.
  # ──────────────────────────────────────────────────────────

  - script: |
      set -euo pipefail
      cd "$(Build.SourcesDirectory)/${{ parameters.path }}"

      REPORT_FILE=".scannerwork/report-task.txt"
      if [ ! -f "$REPORT_FILE" ]; then
        echo "##vso[task.logissue type=error]No $REPORT_FILE found — did the Sonar scan step run?"
        exit 1
      fi

      SERVER_URL=$(grep -oP '(?<=^serverUrl=).*' "$REPORT_FILE")
      CE_TASK_ID=$(grep -oP '(?<=^ceTaskId=).*' "$REPORT_FILE")
      AUTH_HEADER="Authorization: Basic $(printf '%s:' "$RESOLVED_SONAR_TOKEN" | base64 -w0)"

      echo "Polling Compute Engine task $CE_TASK_ID ..."
      CE_STATUS="PENDING"
      for i in $(seq 1 60); do
        CE_STATUS=$(curl -fsS -H "$AUTH_HEADER" "$SERVER_URL/api/ce/task?id=$CE_TASK_ID" | jq -r '.task.status')
        echo "  [$i/60] CE task status: $CE_STATUS"
        case "$CE_STATUS" in
          SUCCESS) break ;;
          FAILED|CANCELED)
            echo "##vso[task.logissue type=error]Compute Engine task ended with status $CE_STATUS"
            exit 1
            ;;
        esac
        sleep 5
      done

      if [ "$CE_STATUS" != "SUCCESS" ]; then
        echo "##vso[task.logissue type=error]Compute Engine task did not finish within the 300s timeout (last status: $CE_STATUS)"
        exit 1
      fi

      ANALYSIS_ID=$(curl -fsS -H "$AUTH_HEADER" "$SERVER_URL/api/ce/task?id=$CE_TASK_ID" | jq -r '.task.analysisId')
      GATE_STATUS=$(curl -fsS -H "$AUTH_HEADER" "$SERVER_URL/api/qualitygates/project_status?analysisId=$ANALYSIS_ID" | jq -r '.projectStatus.status')

      echo "Quality Gate status: $GATE_STATUS"

      if [ "$GATE_STATUS" != "OK" ]; then
        if [ "$(Build.SourceBranch)" = "refs/heads/main" ]; then
          echo "##vso[task.logissue type=error]Quality Gate failed on main — failing the build."
          exit 1
        else
          echo "##vso[task.logissue type=warning]Quality Gate failed on a non-main branch — warning only, build not failed."
        fi
      fi
    displayName: 'Sonar quality gate — ${{ parameters.name }}'
    env:
      RESOLVED_SONAR_TOKEN: $(RESOLVED_SONAR_TOKEN)