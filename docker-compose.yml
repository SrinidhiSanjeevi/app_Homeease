name: homeease

networks:
  homeease-net:
    driver: bridge

volumes:
  mongo-data:

services:

  mongo:
    image: mongo:7
    container_name: homeease-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    expose:
      - "27017"
    networks:
      - homeease-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homeease-backend
    image: homeease-backend:prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - METRICS_COLLECTOR_ENABLED=true
  
    expose:
      - "5000"
    networks:
      - homeease-net
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 512m
    cpus: 0.5

  admin-backend:
    build:
      context: ./admin-backend
      dockerfile: Dockerfile
    container_name: homeease-admin-backend
    image: homeease-admin-backend:prod
    restart: unless-stopped
    env_file:
      - ./admin-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5001
  
    expose:
      - "5001"
    networks:
      - homeease-net
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5001/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: homeease-payment-service
    image: homeease-payment-service:prod
    restart: unless-stopped
    env_file:
      - ./payment-service/.env
    environment:
      - NODE_ENV=production
      - PAYMENT_SERVICE_PORT=5002
      - PORT=5002
    
    expose:
      - "5002"
    networks:
      - homeease-net
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5002/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: homeease-notification-service
    image: homeease-notification-service:prod
    restart: unless-stopped
    env_file:
      - ./notification-service/.env
    environment:
      - NODE_ENV=production
      - NOTIFICATION_SERVICE_PORT=5003
      - PORT=5003
    
    expose:
      - "5003"
    networks:
      - homeease-net
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5003/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homeease-frontend
    image: homeease-frontend:prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - homeease-net
    depends_on:
      backend:
        condition: service_healthy
      admin-backend:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 128m
    cpus: 0.25

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: homeease-admin-frontend
    image: homeease-admin-frontend:prod
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - homeease-net
    depends_on:
      backend:
        condition: service_healthy
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 128m
    cpus: 0.25
