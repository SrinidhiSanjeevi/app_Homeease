name: homeease

networks:
  homeease-net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homeease-backend
    image: homeease-backend:prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    networks:
      - homeease-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  admin-backend:
    build:
      context: ./admin-backend
      dockerfile: Dockerfile
    container_name: homeease-admin-backend
    image: homeease-admin-backend:prod
    restart: unless-stopped
    env_file:
      - ./admin-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5001
    networks:
      - homeease-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5001/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homeease-frontend
    image: homeease-frontend:prod
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - homeease-net
    depends_on:
      backend:
        condition: service_healthy
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3