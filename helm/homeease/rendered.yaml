# Source: homeease/templates/admin-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: homeease-release-homeease-admin
  labels:
    helm.sh/chart: homeease-1.0.0
    app.kubernetes.io/name: homeease
    app.kubernetes.io/instance: homeease-release
    app.kubernetes.io/managed-by: Helm
    app: admin

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: homeease
      app.kubernetes.io/instance: homeease-release
      app: admin

  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeease
        app.kubernetes.io/instance: homeease-release
        app: admin
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: homeease-workload-sa

      containers:
        - name: admin-backend

          image: "acrhomeeasedev.azurecr.io/homeease-admin-backend:a0d965e901af5c0aca32fcd7ab50631fb42be726"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5001
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production

            - name: PORT
              value: "5001"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: MONGO_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: JWT_SECRET

            - name: ALLOWED_ORIGINS
              value: "*"

            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: EMAIL_USER

            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: EMAIL_PASS

            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: EMAIL_FROM

          volumeMounts:
            - name: keyvault-secrets
              mountPath: "/mnt/secrets-store"
              readOnly: true

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false

          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: homeease-secrets
