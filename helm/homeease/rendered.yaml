apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: homeease-secrets

spec:
  provider: azure

  parameters:

    usePodIdentity: "false"

    clientID: "0663c3d7-55c5-41ff-95c9-dbe93c7ead44"

    keyvaultName: "kv-homeease-dev-001"

    tenantId: "25ea82b6-dfae-45a3-8712-f925d1b3397d"

    objects: |
      array:
        - |
          objectName: MONGO-URI
          objectType: secret

        - |
          objectName: JWT-SECRET
          objectType: secret

        - |
          objectName: EMAIL-USER
          objectType: secret

        - |
          objectName: EMAIL-PASS
          objectType: secret

        - |
          objectName: EMAIL-FROM
          objectType: secret

  secretObjects:

    - secretName: homeease-release-homeease-secrets
      type: Opaque

      data:
        - objectName: MONGO-URI
          key: MONGO_URI

        - objectName: JWT-SECRET
          key: JWT_SECRET

        - objectName: EMAIL-USER
          key: EMAIL_USER

        - objectName: EMAIL-PASS
          key: EMAIL_PASS

        - objectName: EMAIL-FROM
          key: EMAIL_FROM
