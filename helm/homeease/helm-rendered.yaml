# Source: homeease/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeease-release-homeease-backend
  labels:
    helm.sh/chart: homeease-1.0.0
    app.kubernetes.io/name: homeease
    app.kubernetes.io/instance: homeease-release
    app.kubernetes.io/managed-by: Helm
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homeease
      app.kubernetes.io/instance: homeease-release
      app: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeease
        app.kubernetes.io/instance: homeease-release
        app: backend
    spec:
      containers:
        - name: backend
          image: "acrhomeeasedev.azurecr.io/homeease-backend:latest"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production

            - name: PORT
              value: "5000"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: MONGO_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: JWT_SECRET

            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: EMAIL_USER

            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: EMAIL_PASS

            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: homeease-release-homeease-secrets
                  key: EMAIL_FROM

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false

          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
