apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    {{- include "homeease.labels" . | nindent 4 }}

spec:
  type: ClusterIP

  selector:
    {{- include "homeease.selectorLabels" . | nindent 4 }}
    app: backend

  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP