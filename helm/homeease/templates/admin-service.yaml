apiVersion: v1
kind: Service
metadata:
  name: admin-service
  labels:
    {{- include "homeease.labels" . | nindent 4 }}
    app: admin

spec:
  type: ClusterIP

  selector:
    {{- include "homeease.selectorLabels" . | nindent 4 }}
    app: admin

  ports:
    - name: http
      port: 5001
      targetPort: 5001
      protocol: TCP