apiVersion: v1
kind: Service

metadata:
  name: frontend-service
  labels:
    {{- include "homeease.labels" . | nindent 4 }}

spec:
  type: ClusterIP

  selector:
    {{- include "homeease.selectorLabels" . | nindent 4 }}
    app: frontend

  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP