apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "homeease.fullname" . }}-backend
  labels:
    {{- include "homeease.labels" . | nindent 4 }}
    app: backend

spec:
  replicas: {{ .Values.replicaCount.backend }}

  selector:
    matchLabels:
      {{- include "homeease.selectorLabels" . | nindent 6 }}
      app: backend

  template:
    metadata:
      labels:
        {{- include "homeease.selectorLabels" . | nindent 8 }}
        app: backend
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: homeease-workload-sa

      containers:
        - name: backend

          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production

            - name: PORT
              value: "5000"

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "homeease.fullname" . }}-secrets
                  key: MONGO_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "homeease.fullname" . }}-secrets
                  key: JWT_SECRET

            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "homeease.fullname" . }}-secrets
                  key: EMAIL_USER

            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "homeease.fullname" . }}-secrets
                  key: EMAIL_PASS

            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ include "homeease.fullname" . }}-secrets
                  key: EMAIL_FROM

          volumeMounts:
            - name: keyvault-secrets
              mountPath: "/mnt/secrets-store"
              readOnly: true

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false

          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.secrets.keyVault.secretProviderClass }}