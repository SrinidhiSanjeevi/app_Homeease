# SonarQube Cloud — HomeEase Backend
# Read by SonarCloudPrepare@4 (configMode: file) in this service's
# sonarcloud-homeease service connection — no token or host URL

# ─── Project Identity ─────────────────────────────────────
sonar.projectKey=homeease-backend
sonar.organization=srinidhisanjeevi
sonar.projectName=HomeEase Backend
sonar.projectVersion=1.0
sonar.projectBaseDir=backend
sonar.newCode.referenceBranch=main

# ─── Source ───────────────────────────────────────────────
sonar.sources=controllers,services,middleware,config,utils,validators,routes,models,metrics.js,server.js

# ─── Tests & Coverage ─────────────────────────────────────
# Tests live in test/ (outside sonar.sources). `npm test` writes the lcov report.
sonar.tests=test
sonar.test.inclusions=test/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Coverage is measured on business logic: utils, validators, middleware, services; wiring is excluded.
# Excluded = glue that only wires express/mongoose/Azure/Prometheus together and is covered by integration, not unit, tests.
sonar.coverage.exclusions=server.js,config/**,routes/**,models/**,controllers/**,metrics.js,services/metricsCollector.js,services/blobStorage.js,scripts/**,test/**

# ─── Language ──────────────────────────────────────────────
sonar.language=js

sonar.exclusions=node_modules/**,scripts/**,**/migrations/**

# ─── Encoding ─────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
