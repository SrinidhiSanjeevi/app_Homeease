# ============================================================
# SonarQube — HomeEase Backend
#
# Consumed by the SonarScanner CLI step in Azure Pipelines
# Validate stage (after tests + coverage).
#
# IMPORTANT:
# - SONAR_TOKEN must be stored as a secret pipeline variable.
# - sonar.host.url must be set as a pipeline variable or
#   passed via -Dsonar.host.url= from the pipeline step.
# ============================================================

# ─── Project Identity ─────────────────────────────────────
sonar.projectKey=homeease-backend
sonar.projectName=HomeEase Backend
sonar.projectVersion=1.0

# ─── Source ───────────────────────────────────────────────
sonar.sources=controllers,services,middleware,config,utils,validators,routes,models,metrics.js,server.js
sonar.tests=__tests__

# ─── Language / Coverage ──────────────────────────────────
sonar.language=js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ─── Exclusions ───────────────────────────────────────────
# Exclude generated and non-application files only.
# DO NOT exclude real application logic.
sonar.exclusions=node_modules/**,coverage/**,scripts/**,**/*.test.js,**/*.spec.js,**/migrations/**
sonar.coverage.exclusions=node_modules/**,coverage/**,scripts/**,**/*.test.js,**/*.spec.js

# ─── Encoding ─────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
