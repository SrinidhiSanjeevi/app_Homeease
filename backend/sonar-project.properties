# ============================================================
# SonarQube Cloud — HomeEase Backend
#
# Read by SonarCloudPrepare@4 (configMode: file) in this service's
# own Validate job, after tests + coverage. Authentication comes
# entirely from the sonarcloud-homeease service connection — no
# token or host URL belongs in this file or anywhere in CI YAML.
# ============================================================

# ─── Project Identity ─────────────────────────────────────
sonar.projectKey=homeease-backend
sonar.projectName=HomeEase Backend
sonar.projectVersion=1.0
sonar.projectBaseDir=backend
sonar.newCode.referenceBranch=main

# ─── Source ───────────────────────────────────────────────
sonar.sources=controllers,services,middleware,config,utils,validators,routes,models,metrics.js,server.js
sonar.tests=__tests__

# ─── Language / Coverage ──────────────────────────────────
sonar.language=js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ─── Exclusions ───────────────────────────────────────────
# Exclude generated and non-application files only.
# DO NOT exclude real application logic.
sonar.exclusions=node_modules/**,coverage/**,scripts/**,**/*.test.js,**/*.spec.js,**/migrations/**
sonar.coverage.exclusions=node_modules/**,coverage/**,scripts/**,**/*.test.js,**/*.spec.js

# ─── Encoding ─────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
