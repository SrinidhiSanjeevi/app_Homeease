# ============================================================
# SonarQube Cloud — HomeEase Backend
#
# Read by SonarCloudPrepare@4 (configMode: file) in this service's
# own Validate job. Authentication comes entirely from the
# sonarcloud-homeease service connection — no token or host URL
# belongs in this file or anywhere in CI YAML.
# ============================================================

# ─── Project Identity ─────────────────────────────────────
sonar.projectKey=homeease-backend
sonar.projectName=HomeEase Backend
sonar.projectVersion=1.0
sonar.projectBaseDir=backend
sonar.newCode.referenceBranch=main

# ─── Source ───────────────────────────────────────────────
sonar.sources=controllers,services,middleware,config,utils,validators,routes,models,metrics.js,server.js

# ─── Language ──────────────────────────────────────────────
sonar.language=js

# ─── Exclusions ───────────────────────────────────────────
# Exclude generated and non-application files only.
# DO NOT exclude real application logic.
sonar.exclusions=node_modules/**,scripts/**,**/migrations/**

# ─── Encoding ─────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
