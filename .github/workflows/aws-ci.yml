#               SONAR_HOST_URL (not sensitive — the SonarCloud instance URL)
#   Secrets:    SONAR_TOKEN

name: aws-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin-backend/**'
      - 'frontend/**'
      - 'admin-frontend/**'
      - 'payment-service/**'
      - 'notification-service/**'
      - '.github/workflows/aws-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin-backend/**'
      - 'frontend/**'
      - 'admin-frontend/**'
      - 'payment-service/**'
      - 'notification-service/**'
      - '.github/workflows/aws-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAMESPACE: homeease
  TRIVY_VERSION: '0.74.0'
  NODE_VERSION: '22'

jobs:

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
      any_changed: ${{ steps.set-matrix.outputs.any_changed }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      commit_created: ${{ steps.meta.outputs.commit_created }}
    steps:
      # Full history: gitleaks must see commits where a secret was
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # COPY, missing USER) fail the job — hadolint's own
      - name: Hadolint — Dockerfile lint
        run: |
          set -euo pipefail
          FAILED=0
          for f in backend admin-backend frontend admin-frontend payment-service notification-service; do
            echo "── hadolint ${f}/Dockerfile ──"
            docker run --rm -i hadolint/hadolint:v2.15.1-alpine \
              hadolint --failure-threshold error - < "${f}/Dockerfile" || FAILED=1
          done
          exit $FAILED

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**']
            admin-backend: ['admin-backend/**']
            frontend: ['frontend/**']
            admin-frontend: ['admin-frontend/**']
            payment-service: ['payment-service/**']
            notification-service: ['notification-service/**']
            workflow: ['.github/workflows/aws-ci.yml']

      - name: Build service matrix
        id: set-matrix
        run: |
          set -euo pipefail
          if [[ "${{ steps.filter.outputs.workflow }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SERVICES='["backend","admin-backend","frontend","admin-frontend","payment-service","notification-service"]'
          else
            SERVICES=$(jq -cn --argjson b ${{ steps.filter.outputs.backend == 'true' && 'true' || 'false' }} \
                              --argjson a ${{ steps.filter.outputs['admin-backend'] == 'true' && 'true' || 'false' }} \
                              --argjson f ${{ steps.filter.outputs.frontend == 'true' && 'true' || 'false' }} \
                              --argjson af ${{ steps.filter.outputs['admin-frontend'] == 'true' && 'true' || 'false' }} \
                              --argjson p ${{ steps.filter.outputs['payment-service'] == 'true' && 'true' || 'false' }} \
                              --argjson n ${{ steps.filter.outputs['notification-service'] == 'true' && 'true' || 'false' }} \
              '[ (if $b then "backend" else empty end),
                 (if $a then "admin-backend" else empty end),
                 (if $f then "frontend" else empty end),
                 (if $af then "admin-frontend" else empty end),
                 (if $p then "payment-service" else empty end),
                 (if $n then "notification-service" else empty end) ]')
          fi
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          if [[ "$SERVICES" == "[]" ]]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Building: ${SERVICES}"

      - name: Compute image metadata
        id: meta
        run: |
          set -euo pipefail
          SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "image_tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "commit_created=$(git show -s --format=%cI "$SHA")" >> "$GITHUB_OUTPUT"

  trivy-db-warmup:
    name: Warm Trivy DB cache
    needs: static
    if: needs.static.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Install Trivy
        run: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            curl -fsSL -o /tmp/trivy.deb \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
            sudo dpkg -i /tmp/trivy.deb
          fi
          trivy --version

      - name: Download Trivy DB
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            set +e
            OUTPUT=$(trivy image --download-db-only 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            if echo "$OUTPUT" | grep -qE "TOOMANYREQUESTS|failed to download vulnerability DB"; then
              echo "::warning::Trivy DB fetch was rate-limited (attempt ${attempt}/5) — retrying in 30s."
              sleep 30
              continue
            fi
            exit "$STATUS"
          done
          echo "::error::Trivy DB fetch still rate-limited after 5 attempts."
          exit 1

  validate:
    name: Validate ${{ matrix.service }}
    needs: [static, trivy-db-warmup]
    if: needs.static.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.static.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: npm ci
        working-directory: ${{ matrix.service }}
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: ${{ matrix.service }}
        if: matrix.service != 'frontend' && matrix.service != 'admin-frontend'
        run: npm run lint

      - name: npm audit (high+)
        working-directory: ${{ matrix.service }}
        run: npm audit --audit-level=high --omit=dev

      - name: Production build
        working-directory: ${{ matrix.service }}
        if: matrix.service == 'frontend' || matrix.service == 'admin-frontend'
        run: npm run build

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Install Trivy
        run: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            curl -fsSL -o /tmp/trivy.deb \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
            sudo dpkg -i /tmp/trivy.deb
          fi
          trivy --version

      - name: Trivy fs
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            OUTPUT=$(trivy fs \
              --scanners vuln,secret,misconfig \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              "${{ matrix.service }}" 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            if echo "$OUTPUT" | grep -qE "TOOMANYREQUESTS|failed to download vulnerability DB"; then
              echo "::warning::Trivy DB fetch was rate-limited (attempt ${attempt}/3) — retrying in 20s."
              sleep 20
              continue
            fi
            exit "$STATUS"
          done
          echo "::error::Trivy DB fetch still rate-limited after 3 attempts."
          exit 1

      - name: SonarQube
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ matrix.service }}

      # for real. Mirrors azure-pipelines.yml's SonarCloudPublish@4
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: ${{ matrix.service }}/.scannerwork/report-task.txt

  package:
    name: Package ${{ matrix.service }}
    needs: [static, validate]
    if: needs.static.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write        # OIDC token for AWS + cosign keyless
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.static.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: homeease-ci-${{ github.run_id }}

      - name: Log in to ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image reference
        id: img
        run: |
          REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          echo "ref=${REGISTRY}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ needs.static.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.img.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Always re-run the runtime stage (apk upgrade + app copy) so a cached
          # layer can never pin an OS package that has since been fixed; the slow
          # dependency/build stage stays cached.
          no-cache-filters: runtime
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.static.outputs.commit_created }}
            org.opencontainers.image.version=${{ needs.static.outputs.image_tag }}
            org.opencontainers.image.title=homeease-${{ matrix.service }}

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Install Trivy
        run: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            curl -fsSL -o /tmp/trivy.deb \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
            sudo dpkg -i /tmp/trivy.deb
          fi
          trivy --version

      - name: Trivy image scan
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            OUTPUT=$(trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              "${{ steps.img.outputs.ref }}" 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            if echo "$OUTPUT" | grep -qE "TOOMANYREQUESTS|failed to download vulnerability DB"; then
              echo "::warning::Trivy DB fetch was rate-limited (attempt ${attempt}/3) — retrying in 20s."
              sleep 20
              continue
            fi
            exit "$STATUS"
          done
          echo "::error::Trivy DB fetch still rate-limited after 3 attempts."
          exit 1

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ steps.img.outputs.ref }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.service }}.cdx.json
          output-file: sbom-${{ matrix.service }}.cdx.json

      - name: Push to ECR + record duration
        if: github.ref == 'refs/heads/main'
        id: push
        run: |
          set -euo pipefail
          START=$(date +%s)
          docker push "${{ steps.img.outputs.ref }}"
          END=$(date +%s)
          DURATION=$((END - START))

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.img.outputs.ref }}")
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${DIGEST} in ${DURATION}s"
          echo "### Pushed \`${DIGEST}\` in ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${{ vars.PUSHGATEWAY_URL }}" ]; then
            cat <<EOF | curl -fsS --max-time 10 --data-binary @- \
              "${{ vars.PUSHGATEWAY_URL }}/metrics/job/homeease_ci/service/${{ matrix.service }}/registry/ecr" || echo "Pushgateway unreachable"
          # TYPE ci_image_push_duration_seconds gauge
          ci_image_push_duration_seconds ${DURATION}
          # TYPE ci_image_push_timestamp gauge
          ci_image_push_timestamp $(date +%s)
          EOF
          fi

      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "${{ steps.push.outputs.digest }}"

      - name: Promote tag to Infrastructure_Homeease (fargate-dev)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "INFRA_REPO_PAT not set — skipping promotion (fargate-dev not wired up yet)."
            exit 0
          fi

          case "${{ matrix.service }}" in
            admin-backend)   FIELD=admin_backend ;;
            admin-frontend)  FIELD=admin_frontend ;;
            payment-service) FIELD=payment_service ;;
            notification-service) FIELD=notification_service ;;
            *)               FIELD="${{ matrix.service }}" ;;
          esac

          WORKDIR=$(mktemp -d)
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/SrinidhiSanjeevi/Infrastruture_Homeease.git" \
            "$WORKDIR/infra"
          cd "$WORKDIR/infra"

          TFVARS="terraform/aws/environments/fargate-dev/image-tags.auto.tfvars"
          sed -i -E "s/^(\s*${FIELD}\s*=\s*)\"[^\"]*\"/\1\"${{ needs.static.outputs.image_tag }}\"/" "$TFVARS"
          grep -q "\"${{ needs.static.outputs.image_tag }}\"" "$TFVARS"

          git config user.name "homeease-ci"
          git config user.email "ci@homeease.local"
          git add "$TFVARS"
          git commit -m "ci(fargate-dev): promote ${{ matrix.service }} to ${{ needs.static.outputs.image_tag }}"
          git push origin HEAD:main