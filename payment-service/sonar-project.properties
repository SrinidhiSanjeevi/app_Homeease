sonar.projectKey=homeease-payment-service
sonar.organization=srinidhisanjeevi
sonar.projectName=HomeEase Payment Service
sonar.projectBaseDir=payment-service
sonar.newCode.referenceBranch=main
sonar.sources=.
sonar.exclusions=node_modules/**,logs/**,coverage/**,test/**,*.md,Dockerfile,.dockerignore
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Tests live in test/ and are not analysed as source code.
sonar.tests=test
sonar.test.inclusions=test/**

# Coverage is measured on business logic (services, controllers, middleware, utils).
# Wiring/glue (server start-up, DB/config, routes, models, metrics) is excluded.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=server.js,config/**,routes/**,models/**,metrics.js,test/**,eslint.config.mjs
