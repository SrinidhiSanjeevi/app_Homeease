sonar.projectKey=homeease-frontend
sonar.organization=srinidhisanjeevi
sonar.projectName=HomeEase Frontend
sonar.projectBaseDir=frontend
sonar.newCode.referenceBranch=main
sonar.sources=src
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,**/*.test.js,**/*.test.jsx
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# coverage is measured on logic (utils/services/api); presentational JSX is excluded
sonar.coverage.exclusions=src/main.jsx,src/App.jsx,src/pages/**,src/components/**,src/hooks/**
