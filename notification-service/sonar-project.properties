sonar.projectKey=homeease-notification-service
sonar.projectName=HomeEase Notification Service
sonar.projectBaseDir=notification-service
sonar.newCode.referenceBranch=main
sonar.sources=.
sonar.exclusions=node_modules/**,logs/**,*.md,Dockerfile,.dockerignore,test/**
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Coverage — populated by `npm run test:coverage` (node --test with the
# built-in lcov reporter) in the Validate stage before SonarCloud analyzes.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
