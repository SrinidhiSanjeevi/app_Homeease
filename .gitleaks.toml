# gitleaks config — HomeEase
# Extends gitleaks' default ruleset (don't lose real detectors) and
# .gitleaksignore instead — this file is only for recurring,

title = "HomeEase gitleaks config"

[extend]
useDefault = true

[allowlist]
  description = "Confirmed non-secret patterns, not one-off historical fixes"

  paths = [
    '''payment-service/__tests__/validateEnv\.test\.js''',
  ]

  regexes = [
    '''(?i)client-?id["'':=\s]+["']?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''',
  ]
