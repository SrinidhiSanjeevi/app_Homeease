# ============================================================
# HomeEase CI/CD Pipeline
#
# Flow:
# Git push
#   -> Node.js install
#   -> npm ci
#   -> application tests/build
#   -> Docker build
#   -> Trivy HIGH/CRITICAL scan
#   -> Push immutable image to Azure Container Registry
#
# Application secrets are NOT used during CI.
# Runtime secrets are stored in Azure Key Vault and consumed
# by AKS through Workload Identity.
# ============================================================

trigger:
  branches:
    include:
      - main

  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - azure-pipelines.yml

# Run CI for pull requests as well.
pr:
  branches:
    include:
      - main

  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - azure-pipelines.yml


# ============================================================
# AGENT
# ============================================================

pool:
  vmImage: 'ubuntu-latest'


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Terraform created this ACR:
  # acrhomeeasedev
  - name: acrName
    value: 'acrhomeeasedev'

  - name: acrLoginServer
    value: '$(acrName).azurecr.io'

  # Every pipeline run receives a unique immutable tag.
  # Example:
  # acrhomeeasedev.azurecr.io/homeease-backend:123
  - name: imageTag
    value: '$(Build.BuildId)'


# ============================================================
# STAGE 1
# APPLICATION VALIDATION
# ============================================================

- stage: Validate
  displayName: 'Validate Application'

  jobs:

    # ========================================================
    # BACKEND
    # ========================================================

    - job: BackendValidation
      displayName: 'Validate Backend'

      steps:

        - task: NodeTool@0
          displayName: 'Install Node.js 22'
          inputs:
            versionSpec: '22.x'

        - script: |
            set -e

            node --version
            npm --version

            cd backend

            npm ci --no-audit --no-fund
          displayName: 'Install backend dependencies'

        - script: |
            set -e

            cd backend

            npm test --if-present
          displayName: 'Run backend tests'


    # ========================================================
    # ADMIN BACKEND
    # ========================================================

    - job: AdminBackendValidation
      displayName: 'Validate Admin Backend'

      steps:

        - task: NodeTool@0
          displayName: 'Install Node.js 22'
          inputs:
            versionSpec: '22.x'

        - script: |
            set -e

            node --version
            npm --version

            cd admin-backend

            npm ci --no-audit --no-fund
          displayName: 'Install admin-backend dependencies'

        - script: |
            set -e

            cd admin-backend

            npm test --if-present
          displayName: 'Run admin-backend tests'


    # ========================================================
    # FRONTEND
    # ========================================================

    - job: FrontendValidation
      displayName: 'Validate Frontend'

      steps:

        - task: NodeTool@0
          displayName: 'Install Node.js 22'
          inputs:
            versionSpec: '22.x'

        - script: |
            set -e

            node --version
            npm --version

            cd frontend

            npm ci --no-audit --no-fund
          displayName: 'Install frontend dependencies'

        - script: |
            set -e

            cd frontend

            npm run build
          displayName: 'Build frontend'


# ============================================================
# STAGE 2
# BACKEND CONTAINER
#
# Build + scan + push happen on THE SAME AGENT.
# ============================================================

- stage: BackendContainer
  displayName: 'Backend Container'
  dependsOn: Validate

  condition: succeeded()

  jobs:

    - job: BuildScanPushBackend
      displayName: 'Build, Scan and Push Backend'

      steps:

        # ----------------------------------------------------
        # Node.js
        # ----------------------------------------------------

        - task: NodeTool@0
          displayName: 'Install Node.js 22'
          inputs:
            versionSpec: '22.x'


        # ----------------------------------------------------
        # ACR LOGIN
        # ----------------------------------------------------

        - task: Docker@2
          displayName: 'Login to Azure Container Registry'
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'


        # ----------------------------------------------------
        # DOCKER BUILD
        # ----------------------------------------------------

        - task: Docker@2
          displayName: 'Build backend Docker image'
          inputs:
            command: 'build'
            repository: 'homeease-backend'
            dockerfile: 'backend/Dockerfile'
            buildContext: 'backend'
            tags: |
              $(imageTag)


        # ----------------------------------------------------
        # TRIVY
        # ----------------------------------------------------

        - script: |
            set -e

            echo "Installing Trivy..."

            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin

            echo "Trivy version:"
            trivy --version

            echo "Scanning backend image..."

            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              homeease-backend:$(imageTag)

          displayName: 'Trivy scan backend'


        # ----------------------------------------------------
        # TAG
        # ----------------------------------------------------

        - script: |
            set -e

            docker tag \
              homeease-backend:$(imageTag) \
              $(acrLoginServer)/homeease-backend:$(imageTag)

          displayName: 'Tag backend image'


        # ----------------------------------------------------
        # PUSH
        # ----------------------------------------------------

        - script: |
            set -e

            docker push \
              $(acrLoginServer)/homeease-backend:$(imageTag)

          displayName: 'Push backend image to ACR'


        # ----------------------------------------------------
        # LOGOUT
        # ----------------------------------------------------

        - task: Docker@2
          displayName: 'Logout from Azure Container Registry'
          inputs:
            command: 'logout'
            containerRegistry: 'acr-service-connection'


# ============================================================
# STAGE 3
# ADMIN BACKEND CONTAINER
# ============================================================

