# ============================================================
# HomeEase CI/CD Pipeline
#
# Flow:
# Git push
#   -> Node.js install
#   -> npm ci
#   -> application tests/build
#   -> Docker build
#   -> Trivy HIGH/CRITICAL scan
#   -> Push immutable image to Azure Container Registry
#   -> Deploy to AKS (main branch only)
#
# Application secrets are NOT used during CI.
# Runtime secrets are stored in Azure Key Vault and consumed
# by AKS through Workload Identity + Secrets Store CSI Driver.
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - azure-pipelines.yml

# Run CI (validate + build + scan) for pull requests too,
# but images are only PUSHED and DEPLOYED on main (see branch guards below).
pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - azure-pipelines.yml

# ============================================================
# AGENT
# ============================================================
pool:
  vmImage: 'ubuntu-latest'

# ============================================================
# VARIABLES
# ============================================================
variables:
  # Terraform created this ACR:
  # acrhomeeasedev
  - name: acrName
    value: 'acrhomeeasedev'
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'
  # Every pipeline run receives a unique immutable tag.
  # Example:
  # acrhomeeasedev.azurecr.io/homeease-backend:123
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: aksClusterName
    value: 'aks-homeease-dev'
  - name: aksResourceGroup
    value: 'rg-homeease-dev'
  - name: k8sNamespace
    value: 'homeease'

# ============================================================
# STAGES
# ============================================================
stages:

# ============================================================
# STAGE 1 — APPLICATION VALIDATION
# ============================================================
- stage: Validate
  displayName: 'Validate Application'
  jobs:
    - job: BackendValidation
      displayName: 'Validate Backend'
      steps:
        - task: NodeTool@0
          displayName: 'Install Node.js 22'
          inputs:
            versionSpec: '22.x'
        - script: |
            set -e
            node --version
            npm --version
            cd backend
            npm ci --no-audit --no-fund
          displayName: 'Install backend dependencies'
        - script: |
            set -e
            cd backend
            npm test --if-present
          displayName: 'Run backend tests'

    - job: AdminBackendValidation
      displayName: 'Validate Admin Backend'
      steps:
        - task: NodeTool@0
          displayName: 'Install Node.js 22'
          inputs:
            versionSpec: '22.x'
        - script: |
            set -e
            node --version
            npm --version
            cd admin-backend
            npm ci --no-audit --no-fund
          displayName: 'Install admin-backend dependencies'
        - script: |
            set -e
            cd admin-backend
            npm test --if-present
          displayName: 'Run admin-backend tests'

    - job: FrontendValidation
      displayName: 'Validate Frontend'
      steps:
        - task: NodeTool@0
          displayName: 'Install Node.js 22'
          inputs:
            versionSpec: '22.x'
        - script: |
            set -e
            node --version
            npm --version
            cd frontend
            npm ci --no-audit --no-fund
          displayName: 'Install frontend dependencies'
        - script: |
            set -e
            cd frontend
            npm run build
          displayName: 'Build frontend'

# ============================================================
# STAGE 2 — BACKEND CONTAINER
# ============================================================
- stage: BackendContainer
  displayName: 'Backend Container'
  dependsOn: Validate
  condition: succeeded()
  jobs:
    - job: BuildScanPushBackend
      displayName: 'Build, Scan and Push Backend'
      steps:
        - task: Docker@2
          displayName: 'Login to Azure Container Registry'
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'

        - task: Docker@2
          displayName: 'Build backend Docker image'
          inputs:
            command: 'build'
            repository: 'homeease-backend'
            dockerfile: 'backend/Dockerfile'
            buildContext: 'backend'
            tags: |
              $(imageTag)

        - script: |
            set -e
            echo "Installing Trivy..."
            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin
            trivy --version
            echo "Scanning backend image..."
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              homeease-backend:$(imageTag)
          displayName: 'Trivy scan backend'

        # Push only from main — PR builds are validated and scanned but never published.
        - script: |
            set -e
            docker tag homeease-backend:$(imageTag) $(acrLoginServer)/homeease-backend:$(imageTag)
            docker push $(acrLoginServer)/homeease-backend:$(imageTag)
          displayName: 'Tag & push backend image'
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

        - task: Docker@2
          displayName: 'Logout from Azure Container Registry'
          inputs:
            command: 'logout'
            containerRegistry: 'acr-service-connection'
          condition: always()

# ============================================================
# STAGE 3 — ADMIN BACKEND CONTAINER
# ============================================================
- stage: AdminBackendContainer
  displayName: 'Admin Backend Container'
  dependsOn: Validate
  condition: succeeded()
  jobs:
    - job: BuildScanPushAdminBackend
      displayName: 'Build, Scan and Push Admin Backend'
      steps:
        - task: Docker@2
          displayName: 'Login to Azure Container Registry'
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'

        - task: Docker@2
          displayName: 'Build admin-backend Docker image'
          inputs:
            command: 'build'
            repository: 'homeease-admin-backend'
            dockerfile: 'admin-backend/Dockerfile'
            buildContext: 'admin-backend'
            tags: |
              $(imageTag)

        - script: |
            set -e
            echo "Installing Trivy..."
            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin
            trivy --version
            echo "Scanning admin-backend image..."
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              homeease-admin-backend:$(imageTag)
          displayName: 'Trivy scan admin-backend'

        - script: |
            set -e
            docker tag homeease-admin-backend:$(imageTag) $(acrLoginServer)/homeease-admin-backend:$(imageTag)
            docker push $(acrLoginServer)/homeease-admin-backend:$(imageTag)
          displayName: 'Tag & push admin-backend image'
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

        - task: Docker@2
          displayName: 'Logout from Azure Container Registry'
          inputs:
            command: 'logout'
            containerRegistry: 'acr-service-connection'
          condition: always()

# ============================================================
# STAGE 4 — FRONTEND CONTAINER
# ============================================================
- stage: FrontendContainer
  displayName: 'Frontend Container'
  dependsOn: Validate
  condition: succeeded()
  jobs:
    - job: BuildScanPushFrontend
      displayName: 'Build, Scan and Push Frontend'
      steps:
        - task: Docker@2
          displayName: 'Login to Azure Container Registry'
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'

        - task: Docker@2
          displayName: 'Build frontend Docker image'
          inputs:
            command: 'build'
            repository: 'homeease-frontend'
            dockerfile: 'frontend/Dockerfile'
            buildContext: 'frontend'
            tags: |
              $(imageTag)

        - script: |
            set -e
            echo "Installing Trivy..."
            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin
            trivy --version
            echo "Scanning frontend image..."
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              homeease-frontend:$(imageTag)
          displayName: 'Trivy scan frontend'

        - script: |
            set -e
            docker tag homeease-frontend:$(imageTag) $(acrLoginServer)/homeease-frontend:$(imageTag)
            docker push $(acrLoginServer)/homeease-frontend:$(imageTag)
          displayName: 'Tag & push frontend image'
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

        - task: Docker@2
          displayName: 'Logout from Azure Container Registry'
          inputs:
            command: 'logout'
            containerRegistry: 'acr-service-connection'
          condition: always()

# ============================================================
# STAGE 5 — DEPLOY TO AKS
#
# Only runs on main, and only after all three images have
# built, scanned clean, and pushed successfully.
# Uses kubectl set image so each service's Deployment picks
# up the new immutable tag without touching Key Vault-backed
# secrets, which are mounted separately via the CSI driver.
# ============================================================
- stage: DeployToAKS
  displayName: 'Deploy to AKS'
  dependsOn:
    - BackendContainer
    - AdminBackendContainer
    - FrontendContainer
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - job: Deploy
      displayName: 'Rollout new images'
      steps:
        - task: AzureCLI@2
          displayName: 'Get AKS credentials'
          inputs:
            azureSubscription: 'acr-service-connection'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -e
              az aks get-credentials \
                --resource-group $(aksResourceGroup) \
                --name $(aksClusterName) \
                --overwrite-existing

        - script: |
            set -e
            kubectl set image deployment/homeease-backend \
              backend=$(acrLoginServer)/homeease-backend:$(imageTag) \
              -n $(k8sNamespace)
            kubectl rollout status deployment/homeease-backend -n $(k8sNamespace) --timeout=180s
          displayName: 'Deploy backend'

        - script: |
            set -e
            kubectl set image deployment/homeease-admin-backend \
              admin-backend=$(acrLoginServer)/homeease-admin-backend:$(imageTag) \
              -n $(k8sNamespace)
            kubectl rollout status deployment/homeease-admin-backend -n $(k8sNamespace) --timeout=180s
          displayName: 'Deploy admin-backend'

        - script: |
            set -e
            kubectl set image deployment/homeease-frontend \
              frontend=$(acrLoginServer)/homeease-frontend:$(imageTag) \
              -n $(k8sNamespace)
            kubectl rollout status deployment/homeease-frontend -n $(k8sNamespace) --timeout=180s
          displayName: 'Deploy frontend'