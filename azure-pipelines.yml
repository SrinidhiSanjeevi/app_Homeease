# ============================================================
# HomeEase — CI/CD Pipeline (Azure DevOps → ACR → Gitops_Homeease)
#
#   Git push / PR
#        │
#        ▼
#   1. STATIC        secret scan, Dockerfile lint, change detection   (repo-wide, 1 job)
#        │
#        ▼
#   2. VALIDATE      lint · test+coverage · npm audit · trivy fs · Sonar   (per changed service)
#        │
#        ▼
#   3. PACKAGE       build → trivy image → SBOM → push → sign      (per changed service, ONE job)
#        │
#        ▼
#   4. PROMOTE       bump image.tag in Gitops_Homeease's charts/*/values-azure-dev.yaml,
#                    commit + push to main    (main only, ONE job, all changed services)
#        │
#        ▼
#   5. VERIFY DEV    wait until DEV serves the promoted tag, then smoke-test it   (main only)
#        │
#        ├──▶ 6. REPORT        push CI duration metrics to Pushgateway
#        │
#        ▼
#   7. PROMOTE PROD  copy the VERIFIED DEV tags into charts/*/values-azure-prod.yaml
#                    — waits for approval on the homeease-prod ADO environment.
#                    Compiled in only when enableProdPromotion is 'true' (below).
#
# Argo CD needs no change to pick up what stage 4 pushes: every service
# Application already has syncPolicy.automated.selfHeal and already
# watches charts/<service>/values-azure-dev.yaml via helm.valueFiles
# (see Gitops_Homeease/argocd/azure/bootstrap/0N-<service>.yaml). It
# picks up the new commit on its next poll with no GitOps-repo change
# required for this feature.
#
# DESIGN NOTES — read before editing
#
# * Build, scan and push live in ONE job per service. The previous
#   version crossed stage boundaries with `docker save` + Pipeline
#   Artifacts, which meant uploading and downloading ~150 MB per
#   service TWICE per run. On the free tier (1 parallel job,
#   1,800 min/month) that was the single biggest consumer of minutes.
#   Nothing is gained: the image is scanned and pushed from the same
#   Docker daemon that built it.
#
# * Image tag is the GIT SHA, not $(Build.BuildId). A build ID cannot
#   be traced back to source. `:latest` is not pushed at all — it makes
#   GitOps non-deterministic and blocks rollback.
#
# * There are no per-environment BUILDS here, by design. CI produces
#   ONE image digest per commit; environments are a promotion concern.
#   Building per-environment would mean staging and prod run different
#   binaries. Stages 4 and 7 never build anything — they only copy an
#   already-pushed tag from one values file to another.
#
# * Trivy is pinned to a release tag and its DB is cached. Pulling
#   install.sh from a moving branch caused a supply-chain break in this
#   project before; pulling the DB anonymously from ghcr.io on every run
#   causes intermittent TOOMANYREQUESTS failures that look like flakes.
#
# * Conditions are kept on ONE LINE. Multi-line conditions have broken
#   YAML parsing in this pipeline before.
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - admin-frontend/**
      - payment-service/**
      - azure-pipelines.yml
      - .azuredevops/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - admin-frontend/**
      - payment-service/**
      - azure-pipelines.yml
      - .azuredevops/**

pool:
  vmImage: 'ubuntu-latest'

# ============================================================
# SERVICE CATALOGUE
#
# The single source of truth. Adding another service means adding
# one entry here — not copying 200 lines of YAML.
# ============================================================

parameters:
  - name: services
    type: object
    default:
      - name: backend
        path: backend
        port: 5000
        hasBuild: false
        hasLint: true
        sonarProjectKey: homeease-backend
      - name: admin-backend
        path: admin-backend
        port: 5001
        hasBuild: false
        hasLint: true
        sonarProjectKey: homeease-admin-backend
      - name: payment-service
        path: payment-service
        port: 5002
        hasBuild: false
        hasLint: true
        sonarProjectKey: homeease-payment-service
      - name: frontend
        path: frontend
        port: 8080
        hasBuild: true
        hasLint: false
        sonarProjectKey: homeease-frontend
      - name: admin-frontend
        path: admin-frontend
        port: 8081
        hasBuild: true
        hasLint: false
        sonarProjectKey: homeease-admin-frontend

variables:
  # PUSHGATEWAY_URL (used by Package/Report stages below) comes from
  # this group. SonarCloud auth is handled entirely by the
  # sonarcloud-homeease service connection, not by any variable here.
  - group: homeease-ci

  - name: acrName
    value: 'acrhomeeasedev01'
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'

  # Repository namespace inside the registry: acrhomeeasedev01.azurecr.io/homeease/backend
  # One registry serves all environments — promotion is by digest, not by registry.
  - name: imageNamespace
    value: 'homeease'

  - name: nodeVersion
    value: '22.x'

  # Pinned. Never install from a moving branch reference.
  - name: trivyVersion
    value: '0.74.0'
  - name: syftVersion
    value: '1.51.1'
  # Pinned. Used only by the Promote stage to edit values-azure-dev.yaml.
  - name: yqVersion
    value: '4.48.1'

  # Only main produces pushed artifacts. PRs build and scan, then discard.
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

  # GitOps repo the Promote stage bumps image.tag in. Chart directory
  # names under charts/ match parameters.services[].name exactly
  # (backend, admin-backend, frontend, admin-frontend, payment-service)
  # — no mapping table needed.
  - name: gitopsRepo
    value: 'github.com/SrinidhiSanjeevi/Gitops_Homeease.git'
  - name: gitopsBranch
    value: 'main'

  # Compile-time switch for stage 7. While 'false', the Promote PROD stage
  # does not exist in the run at all — so no homeease-prod environment is
  # referenced (ADO would silently auto-create one WITHOUT approvals) and
  # no homeease-prod-gitops variable group has to exist yet. Flip to 'true'
  # only after the one-time setup in .azuredevops/README.md is done.
  - name: enableProdPromotion
    value: 'false'

stages:

# ============================================================
# STAGE 1 — STATIC
#
# Repo-wide checks that need no dependencies installed, plus change
# detection so unmodified services are skipped entirely. On a 1-job
# agent this is the difference between a 6-minute run and a 20-minute
# one when you touch a single service.
# ============================================================

- stage: Static
  displayName: '1. Static Analysis'
  jobs:

    - job: Changes
      displayName: 'Secret scan, Dockerfile lint, change detection'
      timeoutInMinutes: 10
      steps:

        # Full history is required: gitleaks must see deleted commits.
        # A secret removed in a later commit is still a leaked secret.
        - checkout: self
          fetchDepth: 0

        - script: |
            set -euo pipefail
            echo "Installing gitleaks"
            GITLEAKS_VERSION=8.30.1
            curl -fsSL -o /tmp/gitleaks.tar.gz \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo mv /tmp/gitleaks /usr/local/bin/
            gitleaks version

            echo "Scanning full git history for secrets"
            gitleaks detect \
              --source . \
              --redact \
              --report-format sarif \
              --report-path "$(Build.ArtifactStagingDirectory)/gitleaks.sarif" \
              --exit-code 1
          displayName: 'Gitleaks — secret scan (full history)'

        - script: |
            set -euo pipefail
            docker pull hadolint/hadolint:v2.15.1-alpine
            FAILED=0
            for f in backend admin-backend frontend admin-frontend payment-service; do
              echo "── hadolint ${f}/Dockerfile ──"
              docker run --rm -i hadolint/hadolint:v2.15.1-alpine \
                hadolint --no-fail - < "${f}/Dockerfile" || FAILED=1
            done
            # Reported, not gated. Promote to `exit $FAILED` once the
            # existing findings (unpinned apk packages, mutable base tags)
            # are cleared.
            exit 0
          displayName: 'Hadolint — Dockerfile lint (report only)'

        - script: |
            set -euo pipefail

            if [ "$(Build.Reason)" = "PullRequest" ]; then
              BASE="origin/$(System.PullRequest.TargetBranch)"
              git fetch --no-tags origin "$(System.PullRequest.TargetBranch)"
              RANGE="${BASE}...HEAD"
            else
              # On main, diff against the commit of the last SUCCESSFUL
              # main build — not HEAD~1. A push of several commits (or a
              # previously failed run) would otherwise hide changes made
              # in the earlier commits. Falls back to HEAD~1, then to
              # "everything changed" on the very first run.
              LAST_GOOD=$(curl -fsS -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds?definitions=$(System.DefinitionId)&branchName=refs/heads/main&resultFilter=succeeded&statusFilter=completed&queryOrder=finishTimeDescending&\$top=1&api-version=7.1" \
                | jq -r '.value[0].sourceVersion // empty' 2>/dev/null || true)

              if [ -n "$LAST_GOOD" ] && git cat-file -e "${LAST_GOOD}^{commit}" 2>/dev/null; then
                echo "Diffing against last successful main build: ${LAST_GOOD}"
                RANGE="${LAST_GOOD}..HEAD"
              elif git rev-parse HEAD~1 >/dev/null 2>&1; then
                echo "No usable last successful build — diffing against HEAD~1"
                RANGE="HEAD~1..HEAD"
              else
                RANGE=""
              fi
            fi

            if [ -z "$RANGE" ]; then
              CHANGED="ALL"
            else
              CHANGED=$(git diff --name-only $RANGE)
            fi
            echo "Changed files:"; echo "$CHANGED"

            # Only changed services are validated, packaged and promoted.
            # A pipeline/template change, the first run, or a manual
            # "Run pipeline" rebuilds everything.
            if echo "$CHANGED" | grep -qE '^(azure-pipelines\.yml|\.azuredevops/)' || [ "$CHANGED" = "ALL" ] || [ "$(Build.Reason)" = "Manual" ]; then
              FORCE_ALL=true
            else
              FORCE_ALL=false
            fi

            for svc in backend admin-backend frontend admin-frontend payment-service; do
              VAR="changed_$(echo $svc | tr '-' '_')"
              if [ "$FORCE_ALL" = "true" ] || echo "$CHANGED" | grep -q "^${svc}/"; then
                echo "  ${svc}: CHANGED"
                echo "##vso[task.setvariable variable=${VAR};isOutput=true]true"
              else
                echo "  ${svc}: unchanged — will be skipped"
                echo "##vso[task.setvariable variable=${VAR};isOutput=true]false"
              fi
            done

            # Same tag for every service built from this commit.
            SHA=$(git rev-parse --short=12 HEAD)
            echo "##vso[task.setvariable variable=imageTag;isOutput=true]${SHA}"
            echo "##vso[task.setvariable variable=commitCreated;isOutput=true]$(git show -s --format=%cI HEAD)"
            echo "Image tag for this run: ${SHA}"
          name: detect
          displayName: 'Detect changed services + compute image tag'
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)

        - publish: '$(Build.ArtifactStagingDirectory)'
          artifact: 'static-analysis-reports'
          condition: always()
          displayName: 'Publish SARIF reports'

# ============================================================
# STAGE 2 — VALIDATE
#
# Per-service fast feedback. Skipped for services this commit
# did not touch.
# ============================================================

- stage: Validate
  displayName: '2. Validate Services'
  dependsOn: Static
  condition: succeeded()
  jobs:
    - ${{ each service in parameters.services }}:
        - job: Validate_${{ replace(service.name, '-', '_') }}
          displayName: 'Validate ${{ service.name }}'
          timeoutInMinutes: 15
          # Skipped when this service did not change (see Static › detect).
          condition: eq(stageDependencies.Static.Changes.outputs['detect.changed_${{ replace(service.name, '-', '_') }}'], 'true')
          steps:
            - template: .azuredevops/templates/validate-service.yml
              parameters:
                name: ${{ service.name }}
                path: ${{ service.path }}
                hasBuild: ${{ service.hasBuild }}
                hasLint: ${{ service.hasLint }}
                nodeVersion: $(nodeVersion)
                trivyVersion: $(trivyVersion)

# ============================================================
# STAGE 3 — PACKAGE
#
# Build → scan → SBOM → push, all in one job so the image never
# leaves the agent between steps. Push only happens on main; PRs
# stop after the scan.
# ============================================================

- stage: Package
  displayName: '3. Build, Scan & Push'
  dependsOn:
    - Static
    - Validate
  condition: succeeded()
  jobs:
    - ${{ each service in parameters.services }}:
        - job: Package_${{ replace(service.name, '-', '_') }}
          displayName: 'Package ${{ service.name }}'
          timeoutInMinutes: 25
          # Skipped when this service did not change (see Static › detect).
          condition: eq(stageDependencies.Static.Changes.outputs['detect.changed_${{ replace(service.name, '-', '_') }}'], 'true')
          variables:
            imageTag: $[ stageDependencies.Static.Changes.outputs['detect.imageTag'] ]
            commitCreated: $[ stageDependencies.Static.Changes.outputs['detect.commitCreated'] ]
          steps:
            - template: .azuredevops/templates/package-service.yml
              parameters:
                name: ${{ service.name }}
                path: ${{ service.path }}
                acrLoginServer: $(acrLoginServer)
                imageNamespace: $(imageNamespace)
                imageTag: $(imageTag)
                commitCreated: $(commitCreated)
                trivyVersion: $(trivyVersion)
                syftVersion: $(syftVersion)

# ============================================================
# STAGE 4 — PROMOTE
#
# Bump image.tag in Gitops_Homeease so Argo CD deploys what Package
# just pushed. Argo CD itself needs no change for this: every service
# Application already has syncPolicy.automated.selfHeal on main and
# already watches charts/<service>/values-azure-dev.yaml via
# helm.valueFiles — this stage only ever edits a value that Application
# already reads, never the chart or Application shape.
#
# ONE job, not one per service, on purpose: all 5 services share a
# single image tag (see Static's "Same tag for every service built
# from this commit"), so bumping all 5 files is naturally one commit.
# Splitting into per-service jobs would mean concurrent pushes to the
# same GitOps branch racing each other for a fast-forward.
#
# Runs only on main, only after Package succeeded — a PR's Package jobs
# build and scan but skip the actual ACR push (see package-service.yml),
# so there's nothing to promote.
# ============================================================

- stage: Promote
  displayName: '4. Promote to GitOps'
  dependsOn:
    - Static
    - Package
  condition: and(succeeded(), eq(variables['isMain'], 'True'))
  jobs:
    - job: Promote
      displayName: 'Bump image tags in Gitops_Homeease'
      timeoutInMinutes: 10
      variables:
        imageTag: $[ stageDependencies.Static.Changes.outputs['detect.imageTag'] ]
        changed_backend: $[ stageDependencies.Static.Changes.outputs['detect.changed_backend'] ]
        changed_admin_backend: $[ stageDependencies.Static.Changes.outputs['detect.changed_admin_backend'] ]
        changed_frontend: $[ stageDependencies.Static.Changes.outputs['detect.changed_frontend'] ]
        changed_admin_frontend: $[ stageDependencies.Static.Changes.outputs['detect.changed_admin_frontend'] ]
        changed_payment_service: $[ stageDependencies.Static.Changes.outputs['detect.changed_payment_service'] ]
      steps:
        - checkout: none

        - script: |
            set -euo pipefail
            echo "Installing yq $(yqVersion)"
            curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/v$(yqVersion)/yq_linux_amd64"
            chmod +x /usr/local/bin/yq
            yq --version
          displayName: 'Install yq'

        - script: |
            set -euo pipefail

            # GITOPS_PAT is a GitHub PAT scoped to Contents:write on
            # Gitops_Homeease only — see .azuredevops/README.md for the
            # variable-group setup this reads it from. Never echoed;
            # Azure DevOps also auto-redacts any secret-variable value
            # found in logs.
            if [ -z "${GITOPS_PAT:-}" ]; then
              echo "##vso[task.logissue type=error]GITOPS_PAT is not set. Add it as a secret variable in the homeease-ci variable group (see .azuredevops/README.md)."
              exit 1
            fi

            echo "GitOps repo:   $(gitopsRepo)"
            echo "GitOps branch: $(gitopsBranch)"

            # Read-only auth check, before anything destructive. Confirms
            # GITOPS_PAT can actually authenticate and see the target
            # branch, so a failure here is unambiguously a token/repo
            # problem and not a clone/push race. Never prints the token:
            # git redacts credentials in its own output, and Azure DevOps
            # separately masks any literal secret-variable value in logs.
            if ! git ls-remote --exit-code \
                 "https://x-access-token:${GITOPS_PAT}@$(gitopsRepo)" \
                 "refs/heads/$(gitopsBranch)" > /tmp/ls-remote.out 2>/tmp/ls-remote.err; then
              echo "##vso[task.logissue type=error]Could not authenticate to $(gitopsRepo) / see refs/heads/$(gitopsBranch) with GITOPS_PAT. This is a token/permissions problem, not a pipeline bug — check the PAT's expiry, its Contents:write scope on Gitops_Homeease, and (for fine-grained tokens) whether it still needs org/repo approval."
              cat /tmp/ls-remote.err
              exit 1
            fi
            echo "Auth check passed — $(gitopsBranch) is reachable with GITOPS_PAT."

            WORKDIR=$(mktemp -d)
            git clone --depth 1 --branch "$(gitopsBranch)" \
              "https://x-access-token:${GITOPS_PAT}@$(gitopsRepo)" \
              "$WORKDIR/gitops"
            cd "$WORKDIR/gitops"
            git config user.name "homeease-ci"
            git config user.email "homeease-ci@users.noreply.github.com"

            declare -A CHANGED=(
              [backend]="$(changed_backend)"
              [admin-backend]="$(changed_admin_backend)"
              [frontend]="$(changed_frontend)"
              [admin-frontend]="$(changed_admin_frontend)"
              [payment-service]="$(changed_payment_service)"
            )

            BUMPED=()
            for svc in "${!CHANGED[@]}"; do
              if [ "${CHANGED[$svc]}" = "true" ]; then
                VALUES_FILE="charts/${svc}/values-azure-dev.yaml"
                if [ ! -f "$VALUES_FILE" ]; then
                  echo "##vso[task.logissue type=error]${VALUES_FILE} not found — chart layout may have changed."
                  exit 1
                fi
                CURRENT_TAG=$(yq '.image.tag' "$VALUES_FILE")
                if [ "$CURRENT_TAG" = "$(imageTag)" ]; then
                  echo "${svc}: already at $(imageTag), nothing to do"
                  continue
                fi
                yq -i '.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"
                echo "${svc}: ${CURRENT_TAG} -> $(imageTag)"
                BUMPED+=("$svc")
              fi
            done

            if [ ${#BUMPED[@]} -eq 0 ]; then
              echo "Nothing to promote — no changed service is behind $(imageTag)."
              # Still publish which GitOps commit DEV is at — Verify DEV
              # and Promote PROD read the DEV tags from exactly this commit.
              DEV_COMMIT=$(git rev-parse HEAD)
              echo "##vso[task.setvariable variable=devCommit;isOutput=true]${DEV_COMMIT}"
              exit 0
            fi

            echo "----- git diff (GitOps values files only) -----"
            git --no-pager diff -- charts/*/values-azure-dev.yaml
            echo "------------------------------------------------"

            git add charts/*/values-azure-dev.yaml
            SERVICE_LIST=$(IFS=', '; echo "${BUMPED[*]}")
            git commit -m "$(printf 'ci: update %s image to %s\n\nSource: SrinidhiSanjeevi/app_Homeease@%s\nBuild: %s' "$SERVICE_LIST" "$(imageTag)" "$(Build.SourceVersion)" "$(Build.BuildId)")"

            if ! git push origin "HEAD:$(gitopsBranch)" 2>/tmp/push.err; then
              cat /tmp/push.err
              if grep -qi "protected branch\|required status check\|pull request" /tmp/push.err; then
                echo "##vso[task.logissue type=error]Push rejected by a GitHub branch protection rule on $(gitopsBranch). Check Gitops_Homeease > Settings > Branches: either allow the GITOPS_PAT identity to bypass required-PR/status-check rules, or note that this branch requires promotion via PR (a workflow change, out of scope for this pipeline)."
              elif grep -qi "403\|authentication failed\|invalid username or token" /tmp/push.err; then
                echo "##vso[task.logissue type=error]Push rejected by GitHub authentication/authorization. Re-check GITOPS_PAT expiry and its Contents:write scope on Gitops_Homeease."
              elif grep -qi "non-fast-forward\|fetch first\|rejected" /tmp/push.err; then
                echo "##vso[task.logissue type=error]$(gitopsBranch) moved on the remote after this job cloned it (e.g. a concurrent manual promotion). Re-run the pipeline rather than force-pushing over it."
              else
                echo "##vso[task.logissue type=error]git push to $(gitopsRepo) failed for an unrecognized reason — see the error above."
              fi
              exit 1
            fi

            DEV_COMMIT=$(git rev-parse HEAD)
            echo "##vso[task.setvariable variable=devCommit;isOutput=true]${DEV_COMMIT}"
            echo "DEV desired state is now Gitops_Homeease@${DEV_COMMIT}"
          name: bump
          displayName: 'Bump image.tag + push'
          env:
            GITOPS_PAT: $(GITOPS_PAT)
            IMAGE_TAG: $(imageTag)

# ============================================================
# STAGE 5 — VERIFY DEV
#
# Promote only proves a commit landed in Git; this proves DEV is
# actually RUNNING it and healthy. It is the evidence stage 7 relies
# on: nothing reaches PROD that did not pass here first.
#
# Reads everything from the GitOps commit Promote published
# (bump.devCommit) — ingress hosts and the backend tag DEV is supposed
# to be at — so nothing here duplicates a value that lives in Git.
#
#   1. rollout   backend /health/live must report version == the DEV
#                image.tag (APP_VERSION, set by charts/backend). Proves
#                Argo CD synced and the new pods took traffic, not just
#                that an old pod is still up.
#   2. health    backend /health/ready must be 200 (MongoDB connected).
#   3. smoke     frontend + admin-frontend must serve / with 200.
#
# Hosts are nip.io on DEV's public ingress IP, reachable from a hosted
# agent. All checks use https with -k: this checks the app, not the TLS
# chain (cert-manager is not installed yet — platform/README.md). Plain
# http to these hostnames is not relied on: it is blocked (403) on some
# networks, while https was verified to return 200 for all three.
#
# Failing here never touches DEV (it is already deployed); it blocks
# PROD promotion and shows up in the Report stage's result metric.
# ============================================================

- stage: DevVerify
  displayName: '5. Verify DEV'
  dependsOn:
    - Promote
  condition: and(succeeded(), eq(variables['isMain'], 'True'))
  jobs:
    - job: Verify
      displayName: 'Wait for DEV rollout + smoke test'
      timeoutInMinutes: 25
      variables:
        devCommit: $[ stageDependencies.Promote.Promote.outputs['bump.devCommit'] ]
      steps:
        - checkout: none

        - script: |
            set -euo pipefail
            curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/v$(yqVersion)/yq_linux_amd64"
            chmod +x /usr/local/bin/yq
            yq --version
          displayName: 'Install yq'

        - script: |
            set -euo pipefail

            if [ -z "${DEV_COMMIT:-}" ]; then
              echo "##vso[task.logissue type=error]Promote did not publish bump.devCommit — cannot tell which DEV state to verify."
              exit 1
            fi

            WORKDIR=$(mktemp -d)
            git clone --quiet --depth 1 --branch "$(gitopsBranch)" \
              "https://x-access-token:${GITOPS_PAT}@$(gitopsRepo)" "$WORKDIR/gitops"
            cd "$WORKDIR/gitops"
            git fetch --quiet --depth 1 origin "$DEV_COMMIT"
            devval() { git show "${DEV_COMMIT}:charts/$1/values-azure-dev.yaml" | yq "$2"; }

            BACKEND_HOST=$(devval backend '.ingress.host')
            BACKEND_TAG=$(devval backend '.image.tag')
            FRONTEND_HOST=$(devval frontend '.ingress.host')
            ADMIN_FRONTEND_HOST=$(devval admin-frontend '.ingress.host')
            echo "Verifying DEV at Gitops_Homeease@${DEV_COMMIT} (backend expected at ${BACKEND_TAG})"

            # One shared budget: Argo CD polls Git every ~3 min, and the
            # backend startupProbe allows up to 2 min for a cold start.
            DEADLINE=$(( $(date +%s) + 15 * 60 ))

            # 1. Rollout — wait for the promoted version to be serving.
            while :; do
              BODY=$(curl -sk --max-time 10 "https://${BACKEND_HOST}/health/live" || true)
              VERSION=$(echo "$BODY" | jq -r '.version // empty' 2>/dev/null || true)
              if [ "$VERSION" = "$BACKEND_TAG" ]; then
                echo "backend is serving ${BACKEND_TAG}"
                break
              fi
              # Images built before /health/live reported a version cannot
              # prove which build is live. Say so loudly and fall back to
              # health-only; once backend is rebuilt once, this never hits.
              if { [ -z "$VERSION" ] && echo "$BODY" | jq -e '.status == "ok"' >/dev/null 2>&1; } || [ "$VERSION" = "unknown" ]; then
                echo "##vso[task.logissue type=warning]backend /health/live does not report a version yet — rollout of ${BACKEND_TAG} NOT confirmed, only health is checked."
                break
              fi
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "##vso[task.logissue type=error]DEV backend still reports version '${VERSION:-unreachable}', expected ${BACKEND_TAG}. Check the backend-dev Application in Argo CD (sync status, pod events)."
                exit 1
              fi
              echo "  backend reports '${VERSION:-unreachable}', waiting..."
              sleep 15
            done

            # 2 + 3. Health and smoke checks, same deadline.
            wait_for_200() {
              local url="$1"
              while :; do
                CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
                if [ "$CODE" = "200" ]; then echo "OK   ${url}"; return 0; fi
                if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                  echo "##vso[task.logissue type=error]${url} returned ${CODE:-no response}, expected 200."
                  return 1
                fi
                echo "  ${url} -> ${CODE:-no response}, waiting..."
                sleep 10
              done
            }

            wait_for_200 "https://${BACKEND_HOST}/health/ready"
            wait_for_200 "https://${FRONTEND_HOST}/"
            wait_for_200 "https://${ADMIN_FRONTEND_HOST}/"

            echo "DEV verified at Gitops_Homeease@${DEV_COMMIT}"
          displayName: 'Verify DEV rollout + health'
          env:
            GITOPS_PAT: $(GITOPS_PAT)
            DEV_COMMIT: $(devCommit)

# ============================================================
# STAGE 6 — REPORT
#
# Ship pipeline timing to Prometheus so CI health is graphable
# alongside app health. Never fails the build: an unreachable
# Pushgateway is a monitoring problem, not a code problem.
#
# Deliberately NOT dependent on stage 7: a PROD approval can wait
# for days, and CI metrics should not wait with it.
# ============================================================

- stage: Report
  displayName: '6. Publish CI Metrics'
  dependsOn:
    - Static
    - Validate
    - Package
    - Promote
    - DevVerify
  condition: always()
  jobs:
    - job: Metrics
      displayName: 'Push CI metrics to Pushgateway'
      timeoutInMinutes: 5
      steps:
        - checkout: none
        - script: |
            set -uo pipefail

            # Pipeline-native timings, free, no instrumentation needed.
            # Requires "Allow scripts to access the OAuth token" on the job.
            curl -fsSL -H "Authorization: Bearer $(System.AccessToken)" \
              "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/timeline?api-version=7.1" \
              -o timeline.json || { echo "timeline fetch failed"; exit 0; }

            STATUS=$(jq -r '[.records[] | select(.type=="Stage") | .result] | if index("failed") then 0 else 1 end' timeline.json)

            {
              echo "# TYPE ci_pipeline_result gauge"
              echo "ci_pipeline_result ${STATUS}"
              echo "# TYPE ci_pipeline_last_run_timestamp gauge"
              echo "ci_pipeline_last_run_timestamp $(date +%s)"

              jq -r '.records[]
                | select(.type=="Job" and .startTime != null and .finishTime != null)
                | "\(.name)|\(((.finishTime|fromdateiso8601) - (.startTime|fromdateiso8601)))"' timeline.json \
              | while IFS='|' read -r NAME DUR; do
                  SAFE=$(echo "$NAME" | tr -c 'a-zA-Z0-9_' '_')
                  echo "# TYPE ci_job_duration_seconds gauge"
                  echo "ci_job_duration_seconds{job_name=\"${SAFE}\"} ${DUR}"
                done
            } > metrics.txt

            cat metrics.txt

            curl -fsS --max-time 10 --data-binary @metrics.txt \
              "$(PUSHGATEWAY_URL)/metrics/job/homeease_ci/pipeline/azure_devops" \
              || echo "Pushgateway unreachable — metrics dropped, build unaffected"
            exit 0
          displayName: 'Emit ci_job_duration_seconds'
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          continueOnError: true

# ============================================================
# STAGE 7 — PROMOTE PROD (approval-gated)
#
# Copies the image tags DEV was VERIFIED at (stage 5) into
# charts/<service>/values-azure-prod.yaml and pushes that one commit.
# Nothing is built, pulled or re-tagged: PROD gets the exact same
# acrhomeeasedev01.azurecr.io/homeease/<service>:<sha> images DEV runs.
#
# THE GATE is the `environment: homeease-prod` below. Azure DevOps
# pauses this stage until an approver on that environment approves;
# no agent is held while it waits. Approvers, the exclusive lock and
# the homeease-prod-gitops variable group are configured once, in the
# ADO UI — see .azuredevops/README.md. Until that is done,
# enableProdPromotion stays 'false' and this stage is not compiled in.
#
# Refuses to promote a STALE run: if DEV has moved on since this run
# verified it (a newer commit was promoted to DEV in the meantime), it
# fails instead of pushing older tags over newer ones. The newer run
# asks for its own approval. lockBehavior: runLatest + the environment's
# Exclusive Lock check additionally cancel superseded runs still waiting.
#
# Uses GITOPS_PROD_PAT from its own variable group, never GITOPS_PAT,
# so the prod-writing credential can be rotated, revoked or restricted
# to this pipeline independently of the DEV one.
# ============================================================

- ${{ if eq(variables.enableProdPromotion, 'true') }}:
  - stage: PromoteProd
    displayName: '7. Promote to PROD (approval required)'
    dependsOn:
      - Promote
      - DevVerify
    condition: and(succeeded(), eq(variables['isMain'], 'True'))
    lockBehavior: runLatest
    variables:
      - group: homeease-prod-gitops
    jobs:
      - deployment: PromoteProd
        displayName: 'Copy verified DEV tags to PROD values'
        environment: homeease-prod
        timeoutInMinutes: 10
        variables:
          devCommit: $[ stageDependencies.Promote.Promote.outputs['bump.devCommit'] ]
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs auto-download every pipeline artifact
                # (SARIF, SBOMs) by default. This job needs none of them.
                - download: none

                - script: |
                    set -euo pipefail
                    curl -fsSL -o /usr/local/bin/yq \
                      "https://github.com/mikefarah/yq/releases/download/v$(yqVersion)/yq_linux_amd64"
                    chmod +x /usr/local/bin/yq
                    yq --version
                  displayName: 'Install yq'

                - script: |
                    set -euo pipefail

                    if [ -z "${GITOPS_PROD_PAT:-}" ]; then
                      echo "##vso[task.logissue type=error]GITOPS_PROD_PAT is not set. Add it to the homeease-prod-gitops variable group (see .azuredevops/README.md). GITOPS_PAT is deliberately NOT used as a fallback."
                      exit 1
                    fi
                    if [ -z "${DEV_COMMIT:-}" ]; then
                      echo "##vso[task.logissue type=error]No verified DEV commit from the Promote stage — refusing to promote."
                      exit 1
                    fi

                    WORKDIR=$(mktemp -d)
                    git clone --quiet --depth 1 --branch "$(gitopsBranch)" \
                      "https://x-access-token:${GITOPS_PROD_PAT}@$(gitopsRepo)" "$WORKDIR/gitops"
                    cd "$WORKDIR/gitops"
                    git fetch --quiet --depth 1 origin "$DEV_COMMIT"
                    git config user.name "homeease-ci"
                    git config user.email "homeease-ci@users.noreply.github.com"

                    BUMPED=()
                    STALE=()
                    for svc in backend admin-backend frontend admin-frontend payment-service; do
                      DEV_FILE="charts/${svc}/values-azure-dev.yaml"
                      PROD_FILE="charts/${svc}/values-azure-prod.yaml"
                      if [ ! -f "$PROD_FILE" ]; then
                        echo "##vso[task.logissue type=error]${PROD_FILE} not found — PROD values must exist before promotion."
                        exit 1
                      fi

                      VERIFIED_TAG=$(git show "${DEV_COMMIT}:${DEV_FILE}" | yq '.image.tag')
                      VERIFIED_REPO=$(git show "${DEV_COMMIT}:${DEV_FILE}" | yq '.image.repository')
                      CURRENT_DEV_TAG=$(yq '.image.tag' "$DEV_FILE")
                      PROD_REPO=$(yq '.image.repository' "$PROD_FILE")
                      PROD_TAG=$(yq '.image.tag' "$PROD_FILE")

                      # Only ever a 12-char git SHA — the only tag stage 1 produces.
                      if ! [[ "$VERIFIED_TAG" =~ ^[0-9a-f]{12}$ ]]; then
                        echo "##vso[task.logissue type=error]${svc}: DEV tag '${VERIFIED_TAG}' is not a 12-char commit SHA — refusing to promote it."
                        exit 1
                      fi
                      # Build once: PROD must pull the very image DEV verified.
                      if [ "$VERIFIED_REPO" != "$PROD_REPO" ]; then
                        echo "##vso[task.logissue type=error]${svc}: PROD image.repository (${PROD_REPO}) differs from DEV (${VERIFIED_REPO}) — PROD would not run the verified image."
                        exit 1
                      fi
                      if [ "$CURRENT_DEV_TAG" != "$VERIFIED_TAG" ]; then
                        STALE+=("${svc}: verified ${VERIFIED_TAG}, DEV is now ${CURRENT_DEV_TAG}")
                        continue
                      fi
                      if [ "$PROD_TAG" = "$VERIFIED_TAG" ]; then
                        echo "${svc}: PROD already at ${VERIFIED_TAG}"
                        continue
                      fi
                      NEW_TAG="$VERIFIED_TAG" yq -i '.image.tag = strenv(NEW_TAG)' "$PROD_FILE"
                      echo "${svc}: PROD ${PROD_TAG} -> ${VERIFIED_TAG}"
                      BUMPED+=("$svc")
                    done

                    if [ ${#STALE[@]} -gt 0 ]; then
                      printf '  %s\n' "${STALE[@]}"
                      echo "##vso[task.logissue type=error]DEV has moved on since this run verified it. Promoting now would push older images to PROD — approve the newest run instead."
                      exit 1
                    fi
                    if [ ${#BUMPED[@]} -eq 0 ]; then
                      echo "Nothing to promote — PROD already matches verified DEV."
                      exit 0
                    fi

                    echo "----- git diff (PROD values files only) -----"
                    git --no-pager diff -- charts/*/values-azure-prod.yaml
                    echo "---------------------------------------------"

                    git add charts/*/values-azure-prod.yaml
                    SERVICE_LIST=$(IFS=', '; echo "${BUMPED[*]}")
                    git commit -m "$(printf 'ci(prod): promote %s to prod\n\nVerified DEV state: Gitops_Homeease@%s\nSource: SrinidhiSanjeevi/app_Homeease@%s\nBuild: %s\nApproved via Azure DevOps environment homeease-prod' "$SERVICE_LIST" "$DEV_COMMIT" "$(Build.SourceVersion)" "$(Build.BuildId)")"

                    if ! git push origin "HEAD:$(gitopsBranch)" 2>/tmp/push.err; then
                      cat /tmp/push.err
                      if grep -qi "non-fast-forward\|fetch first" /tmp/push.err; then
                        echo "##vso[task.logissue type=error]$(gitopsBranch) moved after this job cloned it. Re-run this stage — it re-checks staleness before pushing."
                      else
                        echo "##vso[task.logissue type=error]git push with GITOPS_PROD_PAT failed — check the token's expiry and Contents:write scope on Gitops_Homeease."
                      fi
                      exit 1
                    fi
                    echo "PROD desired state is now Gitops_Homeease@$(git rev-parse HEAD)"
                  displayName: 'Copy verified DEV tags to PROD + push'
                  env:
                    GITOPS_PROD_PAT: $(GITOPS_PROD_PAT)
                    DEV_COMMIT: $(devCommit)
