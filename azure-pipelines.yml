# ============================================================
# HomeEase CI Pipeline
#
# PROCESS-BASED CI/CD STRUCTURE
#
# Git Push
#     |
#     v
# STAGE 1: VALIDATE   (lint/test/build — runs on PR + main)
#     |
#     v
# STAGE 2: BUILD & TAG  (docker build, immutable + latest tags — runs on PR + main)
#     |
#     v
# STAGE 3: TRIVY SECURITY SCAN  (runs on PR + main)
#     |
#     v
# STAGE 4: PUSH TO ACR  (main only)
#
# Backend / Admin Backend / Frontend run as parallel jobs
# INSIDE each stage.
#
# This pipeline is CI ONLY. It does NOT deploy to AKS.
# No application runtime secrets are required during CI —
# only the ACR service connection (used in the Push stage).
#
# Docker images cross stage boundaries as Pipeline Artifacts,
# because each stage in Azure Pipelines runs on a fresh agent
# with its own Docker daemon.
# ============================================================


# ============================================================
# TRIGGER
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - azure-pipelines.yml


# ============================================================
# PULL REQUEST VALIDATION
# ============================================================

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - azure-pipelines.yml


# ============================================================
# AGENT
# ============================================================

pool:
  vmImage: 'ubuntu-latest'


# ============================================================
# VARIABLES
# ============================================================

variables:
  # Azure Container Registry
  - name: acrName
    value: 'acrhomeeasedev'

  # ACR login server
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'

  # Immutable image tag — one build ID for all three services,
  # so backend/admin-backend/frontend images from the same commit
  # always carry a matching tag.
  - name: imageTag
    value: '$(Build.BuildId)'

  # Pinned Trivy version.
  # IMPORTANT: never pull install.sh from Trivy's `main` branch —
  # that exact pattern caused a supply-chain break in this project's
  # GitHub Actions pipeline before (trivy-action tag invalidation,
  # March 2026). Pin a real release tag and bump deliberately.
  - name: trivyVersion
    value: '0.74.0'

  # Node version used across all three services
  - name: nodeVersion
    value: '22.x'


# ============================================================
# STAGES
# ============================================================

stages:


# ============================================================
# STAGE 1 — VALIDATE
#
# Purpose:
# - Install dependencies (cached)
# - Run backend tests
# - Run admin-backend tests
# - Build frontend
#
# Backend / Admin Backend / Frontend run in parallel.
# Runs on both PR and main — this is the fast-feedback gate.
# ============================================================

- stage: Validate

  displayName: '1. Validate Application'

  jobs:

    # ========================================================
    # BACKEND VALIDATION
    # ========================================================

    - job: ValidateBackend

      displayName: 'Backend Validation'

      timeoutInMinutes: 15

      steps:

        - task: UseNode@1
          displayName: 'Install Node.js $(nodeVersion)'
          inputs:
            version: '$(nodeVersion)'

        - task: Cache@2
          displayName: 'Cache node_modules — backend'
          inputs:
            key: 'npm | "$(Agent.OS)" | backend/package-lock.json'
            restoreKeys: |
              npm | "$(Agent.OS)"
            path: 'backend/node_modules'

        - script: |
            set -e
            echo "========================================"
            echo "Backend dependency installation"
            echo "========================================"
            cd backend
            npm ci --no-audit --no-fund
          displayName: 'npm ci — backend'

        - script: |
            set -e
            echo "========================================"
            echo "Backend tests"
            echo "========================================"
            cd backend
            npm test --if-present
          displayName: 'Run backend tests'


    # ========================================================
    # ADMIN BACKEND VALIDATION
    # ========================================================

    - job: ValidateAdminBackend

      displayName: 'Admin Backend Validation'

      timeoutInMinutes: 15

      steps:

        - task: UseNode@1
          displayName: 'Install Node.js $(nodeVersion)'
          inputs:
            version: '$(nodeVersion)'

        - task: Cache@2
          displayName: 'Cache node_modules — admin-backend'
          inputs:
            key: 'npm | "$(Agent.OS)" | admin-backend/package-lock.json'
            restoreKeys: |
              npm | "$(Agent.OS)"
            path: 'admin-backend/node_modules'

        - script: |
            set -e
            echo "========================================"
            echo "Admin backend dependency installation"
            echo "========================================"
            cd admin-backend
            npm ci --no-audit --no-fund
          displayName: 'npm ci — admin-backend'

        - script: |
            set -e
            echo "========================================"
            echo "Admin backend tests"
            echo "========================================"
            cd admin-backend
            npm test --if-present
          displayName: 'Run admin-backend tests'


    # ========================================================
    # FRONTEND VALIDATION
    # ========================================================

    - job: ValidateFrontend

      displayName: 'Frontend Validation'

      timeoutInMinutes: 15

      steps:

        - task: UseNode@1
          displayName: 'Install Node.js $(nodeVersion)'
          inputs:
            version: '$(nodeVersion)'

        - task: Cache@2
          displayName: 'Cache node_modules — frontend'
          inputs:
            key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
            restoreKeys: |
              npm | "$(Agent.OS)"
            path: 'frontend/node_modules'

        - script: |
            set -e
            echo "========================================"
            echo "Frontend dependency installation"
            echo "========================================"
            cd frontend
            npm ci --no-audit --no-fund
          displayName: 'npm ci — frontend'

        - script: |
            set -e
            echo "========================================"
            echo "Frontend production build"
            echo "========================================"
            cd frontend
            npm run build
          displayName: 'Build frontend'


# ============================================================
# STAGE 2 — BUILD & TAG
#
# Purpose:
# - Build the Docker image for each service
# - Apply BOTH tags immediately (immutable build id + latest)
# - Save the tagged image as a Pipeline Artifact
#
# Tagging happens here (not in a separate stage) to avoid an
# extra save/load round-trip — the image only needs to be
# rebuilt-from-artifact twice (Scan, Push) instead of three
# times. No ACR login is required in this stage.
#
# Runs on both PR and main, so PRs get build + scan feedback
# before merge. Only main proceeds to Push (see condition below).
# ============================================================

- stage: Build

  displayName: '2. Build & Tag Docker Images'

  dependsOn: Validate

  condition: succeeded()

  jobs:

    # ========================================================
    # BUILD BACKEND
    # ========================================================

    - job: BuildBackend

      displayName: 'Build & Tag Backend Image'

      timeoutInMinutes: 20

      steps:

        - task: Docker@2
          displayName: 'Build backend Docker image'
          inputs:
            command: 'build'
            repository: 'homeease-backend'
            dockerfile: 'backend/Dockerfile'
            buildContext: 'backend'
            tags: |
              $(imageTag)

        - script: |
            set -e
            echo "========================================"
            echo "Tagging backend image"
            echo "========================================"
            docker tag homeease-backend:$(imageTag) $(acrLoginServer)/homeease-backend:$(imageTag)
            docker tag homeease-backend:$(imageTag) $(acrLoginServer)/homeease-backend:latest

            echo "========================================"
            echo "Saving tagged backend image"
            echo "========================================"
            docker save \
              $(acrLoginServer)/homeease-backend:$(imageTag) \
              $(acrLoginServer)/homeease-backend:latest \
              | gzip > $(Build.ArtifactStagingDirectory)/backend-image.tar.gz

            ls -lh $(Build.ArtifactStagingDirectory)/backend-image.tar.gz
          displayName: 'Tag and save backend image'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish backend image artifact'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/backend-image.tar.gz'
            artifact: 'backend-image'


    # ========================================================
    # BUILD ADMIN BACKEND
    # ========================================================

    - job: BuildAdminBackend

      displayName: 'Build & Tag Admin Backend Image'

      timeoutInMinutes: 20

      steps:

        - task: Docker@2
          displayName: 'Build admin-backend Docker image'
          inputs:
            command: 'build'
            repository: 'homeease-admin-backend'
            dockerfile: 'admin-backend/Dockerfile'
            buildContext: 'admin-backend'
            tags: |
              $(imageTag)

        - script: |
            set -e
            echo "========================================"
            echo "Tagging admin-backend image"
            echo "========================================"
            docker tag homeease-admin-backend:$(imageTag) $(acrLoginServer)/homeease-admin-backend:$(imageTag)
            docker tag homeease-admin-backend:$(imageTag) $(acrLoginServer)/homeease-admin-backend:latest

            echo "========================================"
            echo "Saving tagged admin-backend image"
            echo "========================================"
            docker save \
              $(acrLoginServer)/homeease-admin-backend:$(imageTag) \
              $(acrLoginServer)/homeease-admin-backend:latest \
              | gzip > $(Build.ArtifactStagingDirectory)/admin-backend-image.tar.gz

            ls -lh $(Build.ArtifactStagingDirectory)/admin-backend-image.tar.gz
          displayName: 'Tag and save admin-backend image'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish admin-backend image artifact'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/admin-backend-image.tar.gz'
            artifact: 'admin-backend-image'


    # ========================================================
    # BUILD FRONTEND
    # ========================================================

    - job: BuildFrontend

      displayName: 'Build & Tag Frontend Image'

      timeoutInMinutes: 20

      steps:

        - task: Docker@2
          displayName: 'Build frontend Docker image'
          inputs:
            command: 'build'
            repository: 'homeease-frontend'
            dockerfile: 'frontend/Dockerfile'
            buildContext: 'frontend'
            tags: |
              $(imageTag)

        - script: |
            set -e
            echo "========================================"
            echo "Tagging frontend image"
            echo "========================================"
            docker tag homeease-frontend:$(imageTag) $(acrLoginServer)/homeease-frontend:$(imageTag)
            docker tag homeease-frontend:$(imageTag) $(acrLoginServer)/homeease-frontend:latest

            echo "========================================"
            echo "Saving tagged frontend image"
            echo "========================================"
            docker save \
              $(acrLoginServer)/homeease-frontend:$(imageTag) \
              $(acrLoginServer)/homeease-frontend:latest \
              | gzip > $(Build.ArtifactStagingDirectory)/frontend-image.tar.gz

            ls -lh $(Build.ArtifactStagingDirectory)/frontend-image.tar.gz
          displayName: 'Tag and save frontend image'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish frontend image artifact'
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)/frontend-image.tar.gz'
            artifact: 'frontend-image'


# ============================================================
# STAGE 3 — TRIVY SECURITY SCAN
#
# Purpose:
# - Download the exact tagged images produced by Build
# - Load them into Docker
# - Scan for HIGH/CRITICAL vulnerabilities
# - Fail the pipeline if any unfixed HIGH/CRITICAL are found
#
# Images are NOT rebuilt. Trivy is pinned to $(trivyVersion) —
# never installed from a moving branch reference.
#
# Runs on both PR and main: security gating happens before
# merge, not only on release.
# ============================================================

- stage: SecurityScan

  displayName: '3. Trivy Security Scan'

  dependsOn: Build

  condition: succeeded()

  jobs:

    # ========================================================
    # SCAN BACKEND
    # ========================================================

    - job: ScanBackend

      displayName: 'Scan Backend Image'

      timeoutInMinutes: 15

      steps:

        - task: DownloadPipelineArtifact@2
          displayName: 'Download backend image'
          inputs:
            artifact: 'backend-image'
            path: '$(Pipeline.Workspace)/backend-image'

        - script: |
            set -e
            echo "========================================"
            echo "Loading backend Docker image"
            echo "========================================"
            gunzip -c \
              $(Pipeline.Workspace)/backend-image/backend-image.tar.gz \
              | docker load

            echo "========================================"
            echo "Installing Trivy v$(trivyVersion) (pinned, via .deb release asset)"
            echo "========================================"
            curl -fsSL -o /tmp/trivy.deb \
              https://github.com/aquasecurity/trivy/releases/download/v$(trivyVersion)/trivy_$(trivyVersion)_Linux-64bit.deb
            sudo dpkg -i /tmp/trivy.deb
            trivy --version

            echo "========================================"
            echo "Scanning backend image"
            echo "========================================"
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              $(acrLoginServer)/homeease-backend:$(imageTag)
          displayName: 'Trivy scan — backend'


    # ========================================================
    # SCAN ADMIN BACKEND
    # ========================================================

    - job: ScanAdminBackend

      displayName: 'Scan Admin Backend Image'

      timeoutInMinutes: 15

      steps:

        - task: DownloadPipelineArtifact@2
          displayName: 'Download admin-backend image'
          inputs:
            artifact: 'admin-backend-image'
            path: '$(Pipeline.Workspace)/admin-backend-image'

        - script: |
            set -e
            echo "========================================"
            echo "Loading admin-backend Docker image"
            echo "========================================"
            gunzip -c \
              $(Pipeline.Workspace)/admin-backend-image/admin-backend-image.tar.gz \
              | docker load

            echo "========================================"
            echo "Installing Trivy v$(trivyVersion) (pinned, via .deb release asset)"
            echo "========================================"
            curl -fsSL -o /tmp/trivy.deb \
              https://github.com/aquasecurity/trivy/releases/download/v$(trivyVersion)/trivy_$(trivyVersion)_Linux-64bit.deb
            sudo dpkg -i /tmp/trivy.deb
            trivy --version

            echo "========================================"
            echo "Scanning admin-backend image"
            echo "========================================"
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              $(acrLoginServer)/homeease-admin-backend:$(imageTag)
          displayName: 'Trivy scan — admin-backend'


    # ========================================================
    # SCAN FRONTEND
    # ========================================================

    - job: ScanFrontend

      displayName: 'Scan Frontend Image'

      timeoutInMinutes: 15

      steps:

        - task: DownloadPipelineArtifact@2
          displayName: 'Download frontend image'
          inputs:
            artifact: 'frontend-image'
            path: '$(Pipeline.Workspace)/frontend-image'

        - script: |
            set -e
            echo "========================================"
            echo "Loading frontend Docker image"
            echo "========================================"
            gunzip -c \
              $(Pipeline.Workspace)/frontend-image/frontend-image.tar.gz \
              | docker load

            echo "========================================"
            echo "Installing Trivy v$(trivyVersion) (pinned, via .deb release asset)"
            echo "========================================"
            curl -fsSL -o /tmp/trivy.deb \
              https://github.com/aquasecurity/trivy/releases/download/v$(trivyVersion)/trivy_$(trivyVersion)_Linux-64bit.deb
            sudo dpkg -i /tmp/trivy.deb
            trivy --version

            echo "========================================"
            echo "Scanning frontend image"
            echo "========================================"
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              $(acrLoginServer)/homeease-frontend:$(imageTag)
          displayName: 'Trivy scan — frontend'


# ============================================================
# STAGE 4 — PUSH
#
# Purpose:
# - Authenticate to ACR
# - Load the exact scanned, already-tagged images
# - Push the immutable Build.BuildId tag
# - Push the latest tag
#
# Only main can reach this stage — the images pushed here have
# already passed Validate, Build, and the Trivy security gate.
# ============================================================

- stage: Push

  displayName: '4. Push Images to ACR'

  dependsOn: SecurityScan

  # IMPORTANT: keep this condition on ONE LINE — multi-line
  # conditions have previously broken YAML parsing in this pipeline.
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:

    # ========================================================
    # PUSH BACKEND
    # ========================================================

    - job: PushBackend

      displayName: 'Push Backend to ACR'

      timeoutInMinutes: 15

      steps:

        - task: DownloadPipelineArtifact@2
          displayName: 'Download backend image'
          inputs:
            artifact: 'backend-image'
            path: '$(Pipeline.Workspace)/backend-image'

        - task: Docker@2
          displayName: 'Login to Azure Container Registry'
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'

        - script: |
            set -e
            echo "========================================"
            echo "Loading backend image"
            echo "========================================"
            gunzip -c \
              $(Pipeline.Workspace)/backend-image/backend-image.tar.gz \
              | docker load

            echo "========================================"
            echo "Pushing backend images"
            echo "========================================"
            docker push $(acrLoginServer)/homeease-backend:$(imageTag)
            docker push $(acrLoginServer)/homeease-backend:latest
          displayName: 'Push backend image'

        - task: Docker@2
          displayName: 'Logout from Azure Container Registry'
          inputs:
            command: 'logout'
            containerRegistry: 'acr-service-connection'
          condition: always()


    # ========================================================
    # PUSH ADMIN BACKEND
    # ========================================================

    - job: PushAdminBackend

      displayName: 'Push Admin Backend to ACR'

      timeoutInMinutes: 15

      steps:

        - task: DownloadPipelineArtifact@2
          displayName: 'Download admin-backend image'
          inputs:
            artifact: 'admin-backend-image'
            path: '$(Pipeline.Workspace)/admin-backend-image'

        - task: Docker@2
          displayName: 'Login to Azure Container Registry'
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'

        - script: |
            set -e
            echo "========================================"
            echo "Loading admin-backend image"
            echo "========================================"
            gunzip -c \
              $(Pipeline.Workspace)/admin-backend-image/admin-backend-image.tar.gz \
              | docker load

            echo "========================================"
            echo "Pushing admin-backend images"
            echo "========================================"
            docker push $(acrLoginServer)/homeease-admin-backend:$(imageTag)
            docker push $(acrLoginServer)/homeease-admin-backend:latest
          displayName: 'Push admin-backend image'

        - task: Docker@2
          displayName: 'Logout from Azure Container Registry'
          inputs:
            command: 'logout'
            containerRegistry: 'acr-service-connection'
          condition: always()


    # ========================================================
    # PUSH FRONTEND
    # ========================================================

    - job: PushFrontend

      displayName: 'Push Frontend to ACR'

      timeoutInMinutes: 15

      steps:

        - task: DownloadPipelineArtifact@2
          displayName: 'Download frontend image'
          inputs:
            artifact: 'frontend-image'
            path: '$(Pipeline.Workspace)/frontend-image'

        - task: Docker@2
          displayName: 'Login to Azure Container Registry'
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'

        - script: |
            set -e
            echo "========================================"
            echo "Loading frontend image"
            echo "========================================"
            gunzip -c \
              $(Pipeline.Workspace)/frontend-image/frontend-image.tar.gz \
              | docker load

            echo "========================================"
            echo "Pushing frontend images"
            echo "========================================"
            docker push $(acrLoginServer)/homeease-frontend:$(imageTag)
            docker push $(acrLoginServer)/homeease-frontend:latest
          displayName: 'Push frontend image'

        - task: Docker@2
          displayName: 'Logout from Azure Container Registry'
          inputs:
            command: 'logout'
            containerRegistry: 'acr-service-connection'
          condition: always()