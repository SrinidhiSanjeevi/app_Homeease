# ============================================================
# HomeEase CI Pipeline
#
# PROCESS-BASED CI/CD STRUCTURE
#
# Git Push
#     |
#     v
# STAGE 1: VALIDATE
#     |
#     v
# STAGE 2: BUILD
#     |
#     v
# STAGE 3: TRIVY SECURITY SCAN
#     |
#     v
# STAGE 4: TAG
#     |
#     v
# STAGE 5: PUSH TO ACR
#
# Backend / Admin Backend / Frontend run as parallel jobs
# INSIDE each process stage.
#
# This pipeline is CI ONLY.
# It does NOT deploy to AKS.
#
# No application secrets are required during CI.
#
# Images are transferred between stages using Pipeline Artifacts.
# ============================================================


# ============================================================
# TRIGGER
# ============================================================

trigger:
  branches:
    include:
      - main

  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - azure-pipelines.yml


# ============================================================
# PULL REQUEST VALIDATION
# ============================================================

pr:
  branches:
    include:
      - main

  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - azure-pipelines.yml


# ============================================================
# AGENT
# ============================================================

pool:
  vmImage: 'ubuntu-latest'


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Azure Container Registry
  - name: acrName
    value: 'acrhomeeasedev'

  # ACR login server
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'

  # Immutable image tag
  - name: imageTag
    value: '$(Build.BuildId)'


# ============================================================
# STAGES
# ============================================================


# ============================================================
# STAGE 1 — VALIDATE
#
# Purpose:
# - Install dependencies
# - Run backend tests
# - Run admin-backend tests
# - Build frontend
#
# Backend / Admin Backend / Frontend run in parallel.
# ============================================================

- stage: Validate

  displayName: '1. Validate Application'

  jobs:

    # ========================================================
    # BACKEND VALIDATION
    # ========================================================

    - job: ValidateBackend

      displayName: 'Backend Validation'

      steps:

        - task: NodeTool@0

          displayName: 'Install Node.js 22'

          inputs:
            versionSpec: '22.x'


        - script: |

            set -e

            echo "========================================"
            echo "Backend dependency installation"
            echo "========================================"

            cd backend

            npm ci --no-audit --no-fund

          displayName: 'npm ci — backend'


        - script: |

            set -e

            echo "========================================"
            echo "Backend tests"
            echo "========================================"

            cd backend

            npm test --if-present

          displayName: 'Run backend tests'


    # ========================================================
    # ADMIN BACKEND VALIDATION
    # ========================================================

    - job: ValidateAdminBackend

      displayName: 'Admin Backend Validation'

      steps:

        - task: NodeTool@0

          displayName: 'Install Node.js 22'

          inputs:
            versionSpec: '22.x'


        - script: |

            set -e

            echo "========================================"
            echo "Admin backend dependency installation"
            echo "========================================"

            cd admin-backend

            npm ci --no-audit --no-fund

          displayName: 'npm ci — admin-backend'


        - script: |

            set -e

            echo "========================================"
            echo "Admin backend tests"
            echo "========================================"

            cd admin-backend

            npm test --if-present

          displayName: 'Run admin-backend tests'


    # ========================================================
    # FRONTEND VALIDATION
    # ========================================================

    - job: ValidateFrontend

      displayName: 'Frontend Validation'

      steps:

        - task: NodeTool@0

          displayName: 'Install Node.js 22'

          inputs:
            versionSpec: '22.x'


        - script: |

            set -e

            echo "========================================"
            echo "Frontend dependency installation"
            echo "========================================"

            cd frontend

            npm ci --no-audit --no-fund

          displayName: 'npm ci — frontend'


        - script: |

            set -e

            echo "========================================"
            echo "Frontend production build"
            echo "========================================"

            cd frontend

            npm run build

          displayName: 'Build frontend'


# ============================================================
# STAGE 2 — BUILD
#
# Purpose:
# Build Docker images for all three services.
#
# Images are saved as Pipeline Artifacts.
#
# No ACR login is required here.
# ============================================================

- stage: Build

  displayName: '2. Build Docker Images'

  dependsOn: Validate

  condition: succeeded()

  jobs:

    # ========================================================
    # BUILD BACKEND
    # ========================================================

    - job: BuildBackend

      displayName: 'Build Backend Image'

      steps:

        - task: Docker@2

          displayName: 'Build backend Docker image'

          inputs:

            command: 'build'

            repository: 'homeease-backend'

            dockerfile: 'backend/Dockerfile'

            buildContext: 'backend'

            tags: |
              $(imageTag)


        - script: |

            set -e

            echo "========================================"
            echo "Saving backend Docker image"
            echo "========================================"

            docker save \
              homeease-backend:$(imageTag) \
              | gzip > $(Build.ArtifactStagingDirectory)/backend-image.tar.gz

            ls -lh $(Build.ArtifactStagingDirectory)/backend-image.tar.gz

          displayName: 'Save backend image'


        - task: PublishPipelineArtifact@1

          displayName: 'Publish backend image artifact'

          inputs:

            targetPath: '$(Build.ArtifactStagingDirectory)/backend-image.tar.gz'

            artifact: 'backend-image'


    # ========================================================
    # BUILD ADMIN BACKEND
    # ========================================================

    - job: BuildAdminBackend

      displayName: 'Build Admin Backend Image'

      steps:

        - task: Docker@2

          displayName: 'Build admin-backend Docker image'

          inputs:

            command: 'build'

            repository: 'homeease-admin-backend'

            dockerfile: 'admin-backend/Dockerfile'

            buildContext: 'admin-backend'

            tags: |
              $(imageTag)


        - script: |

            set -e

            echo "========================================"
            echo "Saving admin-backend Docker image"
            echo "========================================"

            docker save \
              homeease-admin-backend:$(imageTag) \
              | gzip > $(Build.ArtifactStagingDirectory)/admin-backend-image.tar.gz

            ls -lh $(Build.ArtifactStagingDirectory)/admin-backend-image.tar.gz

          displayName: 'Save admin-backend image'


        - task: PublishPipelineArtifact@1

          displayName: 'Publish admin-backend image artifact'

          inputs:

            targetPath: '$(Build.ArtifactStagingDirectory)/admin-backend-image.tar.gz'

            artifact: 'admin-backend-image'


    # ========================================================
    # BUILD FRONTEND
    # ========================================================

    - job: BuildFrontend

      displayName: 'Build Frontend Image'

      steps:

        - task: Docker@2

          displayName: 'Build frontend Docker image'

          inputs:

            command: 'build'

            repository: 'homeease-frontend'

            dockerfile: 'frontend/Dockerfile'

            buildContext: 'frontend'

            tags: |
              $(imageTag)


        - script: |

            set -e

            echo "========================================"
            echo "Saving frontend Docker image"
            echo "========================================"

            docker save \
              homeease-frontend:$(imageTag) \
              | gzip > $(Build.ArtifactStagingDirectory)/frontend-image.tar.gz

            ls -lh $(Build.ArtifactStagingDirectory)/frontend-image.tar.gz

          displayName: 'Save frontend image'


        - task: PublishPipelineArtifact@1

          displayName: 'Publish frontend image artifact'

          inputs:

            targetPath: '$(Build.ArtifactStagingDirectory)/frontend-image.tar.gz'

            artifact: 'frontend-image'


# ============================================================
# STAGE 3 — TRIVY SECURITY SCAN
#
# Purpose:
# - Download exact images produced by Build stage
# - Load them into Docker
# - Scan HIGH and CRITICAL vulnerabilities
# - Fail pipeline if unfixed HIGH/CRITICAL vulnerabilities
#   are found
#
# Images are NOT rebuilt.
# ============================================================

- stage: SecurityScan

  displayName: '3. Trivy Security Scan'

  dependsOn: Build

  condition: succeeded()

  jobs:

    # ========================================================
    # SCAN BACKEND
    # ========================================================

    - job: ScanBackend

      displayName: 'Scan Backend Image'

      steps:

        - task: DownloadPipelineArtifact@2

          displayName: 'Download backend image'

          inputs:

            artifact: 'backend-image'

            path: '$(Pipeline.Workspace)/backend-image'


        - script: |

            set -e

            echo "========================================"
            echo "Loading backend Docker image"
            echo "========================================"

            gunzip -c \
              $(Pipeline.Workspace)/backend-image/backend-image.tar.gz \
              | docker load


            echo "========================================"
            echo "Installing Trivy"
            echo "========================================"

            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin

            trivy --version


            echo "========================================"
            echo "Scanning backend image"
            echo "========================================"

            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              homeease-backend:$(imageTag)

          displayName: 'Trivy scan — backend'


    # ========================================================
    # SCAN ADMIN BACKEND
    # ========================================================

    - job: ScanAdminBackend

      displayName: 'Scan Admin Backend Image'

      steps:

        - task: DownloadPipelineArtifact@2

          displayName: 'Download admin-backend image'

          inputs:

            artifact: 'admin-backend-image'

            path: '$(Pipeline.Workspace)/admin-backend-image'


        - script: |

            set -e

            echo "========================================"
            echo "Loading admin-backend Docker image"
            echo "========================================"

            gunzip -c \
              $(Pipeline.Workspace)/admin-backend-image/admin-backend-image.tar.gz \
              | docker load


            echo "========================================"
            echo "Installing Trivy"
            echo "========================================"

            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin

            trivy --version


            echo "========================================"
            echo "Scanning admin-backend image"
            echo "========================================"

            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              homeease-admin-backend:$(imageTag)

          displayName: 'Trivy scan — admin-backend'


    # ========================================================
    # SCAN FRONTEND
    # ========================================================

    - job: ScanFrontend

      displayName: 'Scan Frontend Image'

      steps:

        - task: DownloadPipelineArtifact@2

          displayName: 'Download frontend image'

          inputs:

            artifact: 'frontend-image'

            path: '$(Pipeline.Workspace)/frontend-image'


        - script: |

            set -e

            echo "========================================"
            echo "Loading frontend Docker image"
            echo "========================================"

            gunzip -c \
              $(Pipeline.Workspace)/frontend-image/frontend-image.tar.gz \
              | docker load


            echo "========================================"
            echo "Installing Trivy"
            echo "========================================"

            curl -sfL \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b /usr/local/bin

            trivy --version


            echo "========================================"
            echo "Scanning frontend image"
            echo "========================================"

            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              homeease-frontend:$(imageTag)

          displayName: 'Trivy scan — frontend'


# ============================================================
# STAGE 4 — TAG
#
# Purpose:
# Apply ACR-qualified tags to the exact images that passed
# Trivy scanning.
#
# Example:
#
# acrhomeeasedev.azurecr.io/homeease-backend:123
# acrhomeeasedev.azurecr.io/homeease-backend:latest
#
# Only main is tagged for publishing.
# ============================================================

- stage: Tag

  displayName: '4. Tag Images'

  dependsOn: SecurityScan

  # IMPORTANT:
  # Keep this condition on ONE LINE.
  # This avoids the YAML trigger/parser problem.
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:

    # ========================================================
    # TAG BACKEND
    # ========================================================

    - job: TagBackend

      displayName: 'Tag Backend Image'

      steps:

        - task: DownloadPipelineArtifact@2

          displayName: 'Download backend image'

          inputs:

            artifact: 'backend-image'

            path: '$(Pipeline.Workspace)/backend-image'


        - script: |

            set -e

            echo "========================================"
            echo "Loading backend image"
            echo "========================================"

            gunzip -c \
              $(Pipeline.Workspace)/backend-image/backend-image.tar.gz \
              | docker load


            echo "========================================"
            echo "Creating ACR tags"
            echo "========================================"

            docker tag \
              homeease-backend:$(imageTag) \
              $(acrLoginServer)/homeease-backend:$(imageTag)

            docker tag \
              homeease-backend:$(imageTag) \
              $(acrLoginServer)/homeease-backend:latest


            echo "Tagged images:"

            docker images | grep homeease-backend


            echo "========================================"
            echo "Saving tagged backend image"
            echo "========================================"

            docker save \
              $(acrLoginServer)/homeease-backend:$(imageTag) \
              $(acrLoginServer)/homeease-backend:latest \
              | gzip > $(Build.ArtifactStagingDirectory)/backend-tagged.tar.gz

          displayName: 'Tag backend image'


        - task: PublishPipelineArtifact@1

          displayName: 'Publish tagged backend image'

          inputs:

            targetPath: '$(Build.ArtifactStagingDirectory)/backend-tagged.tar.gz'

            artifact: 'backend-tagged-image'


    # ========================================================
    # TAG ADMIN BACKEND
    # ========================================================

    - job: TagAdminBackend

      displayName: 'Tag Admin Backend Image'

      steps:

        - task: DownloadPipelineArtifact@2

          displayName: 'Download admin-backend image'

          inputs:

            artifact: 'admin-backend-image'

            path: '$(Pipeline.Workspace)/admin-backend-image'


        - script: |

            set -e

            echo "========================================"
            echo "Loading admin-backend image"
            echo "========================================"

            gunzip -c \
              $(Pipeline.Workspace)/admin-backend-image/admin-backend-image.tar.gz \
              | docker load


            echo "========================================"
            echo "Creating ACR tags"
            echo "========================================"

            docker tag \
              homeease-admin-backend:$(imageTag) \
              $(acrLoginServer)/homeease-admin-backend:$(imageTag)

            docker tag \
              homeease-admin-backend:$(imageTag) \
              $(acrLoginServer)/homeease-admin-backend:latest


            echo "Tagged images:"

            docker images | grep homeease-admin-backend


            echo "========================================"
            echo "Saving tagged admin-backend image"
            echo "========================================"

            docker save \
              $(acrLoginServer)/homeease-admin-backend:$(imageTag) \
              $(acrLoginServer)/homeease-admin-backend:latest \
              | gzip > $(Build.ArtifactStagingDirectory)/admin-backend-tagged.tar.gz

          displayName: 'Tag admin-backend image'


        - task: PublishPipelineArtifact@1

          displayName: 'Publish tagged admin-backend image'

          inputs:

            targetPath: '$(Build.ArtifactStagingDirectory)/admin-backend-tagged.tar.gz'

            artifact: 'admin-backend-tagged-image'


    # ========================================================
    # TAG FRONTEND
    # ========================================================

    - job: TagFrontend

      displayName: 'Tag Frontend Image'

      steps:

        - task: DownloadPipelineArtifact@2

          displayName: 'Download frontend image'

          inputs:

            artifact: 'frontend-image'

            path: '$(Pipeline.Workspace)/frontend-image'


        - script: |

            set -e

            echo "========================================"
            echo "Loading frontend image"
            echo "========================================"

            gunzip -c \
              $(Pipeline.Workspace)/frontend-image/frontend-image.tar.gz \
              | docker load


            echo "========================================"
            echo "Creating ACR tags"
            echo "========================================"

            docker tag \
              homeease-frontend:$(imageTag) \
              $(acrLoginServer)/homeease-frontend:$(imageTag)

            docker tag \
              homeease-frontend:$(imageTag) \
              $(acrLoginServer)/homeease-frontend:latest


            echo "Tagged images:"

            docker images | grep homeease-frontend


            echo "========================================"
            echo "Saving tagged frontend image"
            echo "========================================"

            docker save \
              $(acrLoginServer)/homeease-frontend:$(imageTag) \
              $(acrLoginServer)/homeease-frontend:latest \
              | gzip > $(Build.ArtifactStagingDirectory)/frontend-tagged.tar.gz

          displayName: 'Tag frontend image'


        - task: PublishPipelineArtifact@1

          displayName: 'Publish tagged frontend image'

          inputs:

            targetPath: '$(Build.ArtifactStagingDirectory)/frontend-tagged.tar.gz'

            artifact: 'frontend-tagged-image'


# ============================================================
# STAGE 5 — PUSH
#
# Purpose:
# - Authenticate to ACR
# - Load the exact scanned/tagged images
# - Push immutable Build.BuildId tag
# - Push latest tag
#
# Only main can reach this stage.
# ============================================================

- stage: Push

  displayName: '5. Push Images to ACR'

  dependsOn: Tag

  # IMPORTANT:
  # Keep this condition on ONE LINE.
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:

    # ========================================================
    # PUSH BACKEND
    # ========================================================

    - job: PushBackend

      displayName: 'Push Backend to ACR'

      steps:

        - task: DownloadPipelineArtifact@2

          displayName: 'Download tagged backend image'

          inputs:

            artifact: 'backend-tagged-image'

            path: '$(Pipeline.Workspace)/backend-tagged-image'


        - task: Docker@2

          displayName: 'Login to Azure Container Registry'

          inputs:

            command: 'login'

            containerRegistry: 'acr-service-connection'


        - script: |

            set -e

            echo "========================================"
            echo "Loading tagged backend image"
            echo "========================================"

            gunzip -c \
              $(Pipeline.Workspace)/backend-tagged-image/backend-tagged.tar.gz \
              | docker load


            echo "========================================"
            echo "Pushing backend immutable image"
            echo "========================================"

            docker push \
              $(acrLoginServer)/homeease-backend:$(imageTag)


            echo "========================================"
            echo "Pushing backend latest image"
            echo "========================================"

            docker push \
              $(acrLoginServer)/homeease-backend:latest

          displayName: 'Push backend image'


        - task: Docker@2

          displayName: 'Logout from Azure Container Registry'

          inputs:

            command: 'logout'

            containerRegistry: 'acr-service-connection'

          condition: always()


    # ========================================================
    # PUSH ADMIN BACKEND
    # ========================================================

    - job: PushAdminBackend

      displayName: 'Push Admin Backend to ACR'

      steps:

        - task: DownloadPipelineArtifact@2

          displayName: 'Download tagged admin-backend image'

          inputs:

            artifact: 'admin-backend-tagged-image'

            path: '$(Pipeline.Workspace)/admin-backend-tagged-image'


        - task: Docker@2

          displayName: 'Login to Azure Container Registry'

          inputs:

            command: 'login'

            containerRegistry: 'acr-service-connection'


        - script: |

            set -e

            echo "========================================"
            echo "Loading tagged admin-backend image"
            echo "========================================"

            gunzip -c \
              $(Pipeline.Workspace)/admin-backend-tagged-image/admin-backend-tagged.tar.gz \
              | docker load


            echo "========================================"
            echo "Pushing admin-backend immutable image"
            echo "========================================"

            docker push \
              $(acrLoginServer)/homeease-admin-backend:$(imageTag)


            echo "========================================"
            echo "Pushing admin-backend latest image"
            echo "========================================"

            docker push \
              $(acrLoginServer)/homeease-admin-backend:latest

          displayName: 'Push admin-backend image'


        - task: Docker@2

          displayName: 'Logout from Azure Container Registry'

          inputs:

            command: 'logout'

            containerRegistry: 'acr-service-connection'

          condition: always()


    # ========================================================
    # PUSH FRONTEND
    # ========================================================

    - job: PushFrontend

      displayName: 'Push Frontend to ACR'

      steps:

        - task: DownloadPipelineArtifact@2

          displayName: 'Download tagged frontend image'

          inputs:

            artifact: 'frontend-tagged-image'

            path: '$(Pipeline.Workspace)/frontend-tagged-image'


        - task: Docker@2

          displayName: 'Login to Azure Container Registry'

          inputs:

            command: 'login'

            containerRegistry: 'acr-service-connection'


        - script: |

            set -e

            echo "========================================"
            echo "Loading tagged frontend image"
            echo "========================================"

            gunzip -c \
              $(Pipeline.Workspace)/frontend-tagged-image/frontend-tagged.tar.gz \
              | docker load


            echo "========================================"
            echo "Pushing frontend immutable image"
            echo "========================================"

            docker push \
              $(acrLoginServer)/homeease-frontend:$(imageTag)


            echo "========================================"
            echo "Pushing frontend latest image"
            echo "========================================"

            docker push \
              $(acrLoginServer)/homeease-frontend:latest

          displayName: 'Push frontend image'


        - task: Docker@2

          displayName: 'Logout from Azure Container Registry'

          inputs:

            command: 'logout'

            containerRegistry: 'acr-service-connection'

          condition: always()