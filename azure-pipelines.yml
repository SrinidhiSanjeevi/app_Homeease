# ============================================================
# HomeEase — CI Pipeline (Azure DevOps → ACR)
#
#   Git push / PR
#        │
#        ▼
#   1. STATIC        secret scan, Dockerfile lint, change detection   (repo-wide, 1 job)
#        │
#        ▼
#   2. VALIDATE      lint · test+coverage · npm audit · trivy fs · Sonar   (per changed service)
#        │
#        ▼
#   3. PACKAGE       build → trivy image → SBOM → push → sign      (per changed service, ONE job)
#        │
#        ▼
#   4. REPORT        push CI duration metrics to Pushgateway
#
# DESIGN NOTES — read before editing
#
# * Build, scan and push live in ONE job per service. The previous
#   version crossed stage boundaries with `docker save` + Pipeline
#   Artifacts, which meant uploading and downloading ~150 MB per
#   service TWICE per run. On the free tier (1 parallel job,
#   1,800 min/month) that was the single biggest consumer of minutes.
#   Nothing is gained: the image is scanned and pushed from the same
#   Docker daemon that built it.
#
# * Image tag is the GIT SHA, not $(Build.BuildId). A build ID cannot
#   be traced back to source. `:latest` is not pushed at all — it makes
#   GitOps non-deterministic and blocks rollback.
#
# * There are no dev/staging/prod stages here, by design. CI produces
#   ONE image digest per commit; environments are a promotion concern
#   handled by CD. Building per-environment would mean staging and prod
#   run different binaries.
#
# * Trivy is pinned to a release tag and its DB is cached. Pulling
#   install.sh from a moving branch caused a supply-chain break in this
#   project before; pulling the DB anonymously from ghcr.io on every run
#   causes intermittent TOOMANYREQUESTS failures that look like flakes.
#
# * Conditions are kept on ONE LINE. Multi-line conditions have broken
#   YAML parsing in this pipeline before.
# ============================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - payment-service/**
      - azure-pipelines.yml
      - .azuredevops/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - payment-service/**
      - azure-pipelines.yml
      - .azuredevops/**

pool:
  vmImage: 'ubuntu-latest'

# ============================================================
# SERVICE CATALOGUE
#
# The single source of truth. Adding a fifth service means adding
# one entry here — not copying 200 lines of YAML.
# ============================================================

parameters:
  - name: services
    type: object
    default:
      - name: backend
        path: backend
        port: 5000
        hasTests: true
        hasLint: true
        sonarProjectKey: homeease-backend
      - name: admin-backend
        path: admin-backend
        port: 5001
        hasTests: true
        hasLint: true
        sonarProjectKey: homeease-admin-backend
      - name: payment-service
        path: payment-service
        port: 5002
        hasTests: true
        hasLint: true
        sonarProjectKey: homeease-payment-service
      - name: frontend
        path: frontend
        port: 8080
        hasTests: false
        hasLint: false
        sonarProjectKey: homeease-frontend

variables:
  # Secrets (SONAR_TOKEN, SONAR_HOST_URL) come from a variable group
  # linked to Key Vault. Nothing sensitive is ever written in this file.
  - group: homeease-ci

  - name: acrName
    value: 'acrhomeeasedev'
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'

  # Repository namespace inside the registry: acrhomeeasedev.azurecr.io/homeease/backend
  # One registry serves all environments — promotion is by digest, not by registry.
  - name: imageNamespace
    value: 'homeease'

  - name: nodeVersion
    value: '22.x'

  # Pinned. Never install from a moving branch reference.
  - name: trivyVersion
    value: '0.74.0'
  - name: syftVersion
    value: '1.51.1'

  # Only main produces pushed artifacts. PRs build and scan, then discard.
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

stages:

# ============================================================
# STAGE 1 — STATIC
#
# Repo-wide checks that need no dependencies installed, plus change
# detection so unmodified services are skipped entirely. On a 1-job
# agent this is the difference between a 6-minute run and a 20-minute
# one when you touch a single service.
# ============================================================

- stage: Static
  displayName: '1. Static Analysis'
  jobs:

    - job: Changes
      displayName: 'Secret scan, Dockerfile lint, change detection'
      timeoutInMinutes: 10
      steps:

        # Full history is required: gitleaks must see deleted commits.
        # A secret removed in a later commit is still a leaked secret.
        - checkout: self
          fetchDepth: 0

        - script: |
            set -euo pipefail
            echo "Installing gitleaks"
            GITLEAKS_VERSION=8.30.1
            curl -fsSL -o /tmp/gitleaks.tar.gz \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo mv /tmp/gitleaks /usr/local/bin/
            gitleaks version

            echo "Scanning full git history for secrets"
            gitleaks detect \
              --source . \
              --redact \
              --report-format sarif \
              --report-path "$(Build.ArtifactStagingDirectory)/gitleaks.sarif" \
              --exit-code 1
          displayName: 'Gitleaks — secret scan (full history)'

        - script: |
            set -euo pipefail
            docker pull hadolint/hadolint:v2.15.1-alpine
            FAILED=0
            for f in backend admin-backend frontend payment-service; do
              echo "── hadolint ${f}/Dockerfile ──"
              docker run --rm -i hadolint/hadolint:v2.15.1-alpine \
                hadolint --no-fail - < "${f}/Dockerfile" || FAILED=1
            done
            # Reported, not gated. Promote to `exit $FAILED` once the
            # existing findings (unpinned apk packages, mutable base tags)
            # are cleared.
            exit 0
          displayName: 'Hadolint — Dockerfile lint (report only)'

        - script: |
            set -euo pipefail

            if [ "$(Build.Reason)" = "PullRequest" ]; then
              BASE="origin/$(System.PullRequest.TargetBranch)"
              git fetch --no-tags origin "$(System.PullRequest.TargetBranch)"
              RANGE="${BASE}...HEAD"
            else
              # On main, diff against the previous commit. If this is the
              # first commit, fall back to "everything changed".
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                RANGE="HEAD~1..HEAD"
              else
                RANGE=""
              fi
            fi

            if [ -z "$RANGE" ]; then
              CHANGED="ALL"
            else
              CHANGED=$(git diff --name-only $RANGE)
            fi
            echo "Changed files:"; echo "$CHANGED"

            # A change to the pipeline itself rebuilds everything.
            if echo "$CHANGED" | grep -qE '^(azure-pipelines\.yml|\.azuredevops/)' || [ "$CHANGED" = "ALL" ]; then
              FORCE_ALL=true
            else
              FORCE_ALL=false
            fi

            for svc in backend admin-backend frontend payment-service; do
              VAR="changed_$(echo $svc | tr '-' '_')"
              if [ "$FORCE_ALL" = "true" ] || echo "$CHANGED" | grep -q "^${svc}/"; then
                echo "  ${svc}: CHANGED"
                echo "##vso[task.setvariable variable=${VAR};isOutput=true]true"
              else
                echo "  ${svc}: unchanged — will be skipped"
                echo "##vso[task.setvariable variable=${VAR};isOutput=true]false"
              fi
            done

            # Same tag for every service built from this commit.
            SHA=$(git rev-parse --short=12 HEAD)
            echo "##vso[task.setvariable variable=imageTag;isOutput=true]${SHA}"
            echo "##vso[task.setvariable variable=commitCreated;isOutput=true]$(git show -s --format=%cI HEAD)"
            echo "Image tag for this run: ${SHA}"
          name: detect
          displayName: 'Detect changed services + compute image tag'

        - publish: '$(Build.ArtifactStagingDirectory)'
          artifact: 'static-analysis-reports'
          condition: always()
          displayName: 'Publish SARIF reports'

# ============================================================
# STAGE 2 — VALIDATE
#
# Per-service fast feedback. Skipped for services this commit
# did not touch.
# ============================================================

- stage: Validate
  displayName: '2. Validate Services'
  dependsOn: Static
  condition: succeeded()
  jobs:
    - ${{ each service in parameters.services }}:
        - job: Validate_${{ replace(service.name, '-', '_') }}
          displayName: 'Validate ${{ service.name }}'
          timeoutInMinutes: 15
          condition: eq(stageDependencies.Static.Changes.outputs['detect.changed_${{ replace(service.name, '-', '_') }}'], 'true')
          steps:
            - template: .azuredevops/templates/validate-service.yml
              parameters:
                name: ${{ service.name }}
                path: ${{ service.path }}
                hasTests: ${{ service.hasTests }}
                hasLint: ${{ service.hasLint }}
                sonarProjectKey: ${{ service.sonarProjectKey }}
                nodeVersion: $(nodeVersion)
                trivyVersion: $(trivyVersion)

# ============================================================
# STAGE 3 — PACKAGE
#
# Build → scan → SBOM → push, all in one job so the image never
# leaves the agent between steps. Push only happens on main; PRs
# stop after the scan.
# ============================================================

- stage: Package
  displayName: '3. Build, Scan & Push'
  dependsOn:
    - Static
    - Validate
  condition: succeeded()
  jobs:
    - ${{ each service in parameters.services }}:
        - job: Package_${{ replace(service.name, '-', '_') }}
          displayName: 'Package ${{ service.name }}'
          timeoutInMinutes: 25
          condition: eq(stageDependencies.Static.Changes.outputs['detect.changed_${{ replace(service.name, '-', '_') }}'], 'true')
          variables:
            imageTag: $[ stageDependencies.Static.Changes.outputs['detect.imageTag'] ]
            commitCreated: $[ stageDependencies.Static.Changes.outputs['detect.commitCreated'] ]
          steps:
            - template: .azuredevops/templates/package-service.yml
              parameters:
                name: ${{ service.name }}
                path: ${{ service.path }}
                acrLoginServer: $(acrLoginServer)
                imageNamespace: $(imageNamespace)
                imageTag: $(imageTag)
                commitCreated: $(commitCreated)
                trivyVersion: $(trivyVersion)
                syftVersion: $(syftVersion)
                pushEnabled: $(isMain)

# ============================================================
# STAGE 4 — REPORT
#
# Ship pipeline timing to Prometheus so CI health is graphable
# alongside app health. Never fails the build: an unreachable
# Pushgateway is a monitoring problem, not a code problem.
# ============================================================

- stage: Report
  displayName: '4. Publish CI Metrics'
  dependsOn:
    - Static
    - Validate
    - Package
  condition: always()
  jobs:
    - job: Metrics
      displayName: 'Push CI metrics to Pushgateway'
      timeoutInMinutes: 5
      steps:
        - checkout: none
        - script: |
            set -uo pipefail

            # Pipeline-native timings, free, no instrumentation needed.
            # Requires "Allow scripts to access the OAuth token" on the job.
            curl -fsSL -u ":$(System.AccessToken)" \
              "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/timeline?api-version=7.1" \
              -o timeline.json || { echo "timeline fetch failed"; exit 0; }

            STATUS=$(jq -r '[.records[] | select(.type=="Stage") | .result] | if index("failed") then 0 else 1 end' timeline.json)

            {
              echo "# TYPE ci_pipeline_result gauge"
              echo "ci_pipeline_result ${STATUS}"
              echo "# TYPE ci_pipeline_last_run_timestamp gauge"
              echo "ci_pipeline_last_run_timestamp $(date +%s)"

              jq -r '.records[]
                | select(.type=="Job" and .startTime != null and .finishTime != null)
                | "\(.name)|\(((.finishTime|fromdateiso8601) - (.startTime|fromdateiso8601)))"' timeline.json \
              | while IFS='|' read -r NAME DUR; do
                  SAFE=$(echo "$NAME" | tr -c 'a-zA-Z0-9_' '_')
                  echo "# TYPE ci_job_duration_seconds gauge"
                  echo "ci_job_duration_seconds{job_name=\"${SAFE}\"} ${DUR}"
                done
            } > metrics.txt

            cat metrics.txt

            curl -fsS --max-time 10 --data-binary @metrics.txt \
              "$(PUSHGATEWAY_URL)/metrics/job/homeease_ci/pipeline/azure_devops" \
              || echo "Pushgateway unreachable — metrics dropped, build unaffected"
            exit 0
          displayName: 'Emit ci_job_duration_seconds'
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          continueOnError: true