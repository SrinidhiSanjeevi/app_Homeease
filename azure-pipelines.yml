trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - admin-frontend/**
      - payment-service/**
      - notification-service/**
      - azure-pipelines.yml
      - .azuredevops/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**
      - admin-backend/**
      - frontend/**
      - admin-frontend/**
      - payment-service/**
      - notification-service/**
      - azure-pipelines.yml
      - .azuredevops/**

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: services
    type: object
    default:
      - name: backend
        path: backend
        port: 5000
        hasBuild: false
        hasLint: true
        hasTests: true
        sonarProjectKey: homeease-backend
      - name: admin-backend
        path: admin-backend
        port: 5001
        hasBuild: false
        hasLint: true
        hasTests: true
        sonarProjectKey: homeease-admin-backend
      - name: payment-service
        path: payment-service
        port: 5002
        hasBuild: false
        hasLint: true
        hasTests: true
        sonarProjectKey: homeease-payment-service
      - name: notification-service
        path: notification-service
        port: 5003
        hasBuild: false
        hasLint: true
        hasTests: true
        sonarProjectKey: homeease-notification-service
      - name: frontend
        path: frontend
        port: 8080
        hasBuild: true
        hasLint: false
        hasTests: true
        sonarProjectKey: homeease-frontend
      - name: admin-frontend
        path: admin-frontend
        port: 8081
        hasBuild: true
        hasLint: false
        hasTests: true
        sonarProjectKey: homeease-admin-frontend

variables:
  - group: homeease-ci

  - name: acrName
    value: 'acrhomeeasedev01'
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'

  - name: imageNamespace
    value: 'homeease'

  - name: nodeVersion
    value: '22.x'

  # Pinned. Never install from a moving branch reference.
  - name: trivyVersion
    value: '0.74.0'
  - name: syftVersion
    value: '1.51.1'
  - name: yqVersion
    value: '4.48.1'

  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

  # GitOps repo the Promote stage bumps image.tag in.
  - name: gitopsRepo
    value: 'github.com/SrinidhiSanjeevi/Gitops_Homeease.git'
  - name: gitopsBranch
    value: 'main'

  - name: enableProdPromotion
    value: 'false'

  - name: enableStagingPromotion
    value: 'true'

stages:

- stage: Static
  displayName: '1. Static Analysis'
  jobs:

    - job: Changes
      displayName: 'Secret scan, Dockerfile lint, change detection'
      timeoutInMinutes: 10
      steps:

        # Full history is required: gitleaks must see deleted commits.
        - checkout: self
          fetchDepth: 0

        - script: |
            set -euo pipefail
            echo "Installing gitleaks"
            GITLEAKS_VERSION=8.30.1
            curl -fsSL -o /tmp/gitleaks.tar.gz \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo mv /tmp/gitleaks /usr/local/bin/
            gitleaks version

            echo "Scanning full git history for secrets"
            gitleaks detect \
              --source . \
              --redact \
              --report-format sarif \
              --report-path "$(Build.ArtifactStagingDirectory)/gitleaks.sarif" \
              --exit-code 1
          displayName: 'Gitleaks — secret scan (full history)'

        - script: |
            set -euo pipefail
            docker pull hadolint/hadolint:v2.15.1-alpine
            FAILED=0
            for f in backend admin-backend frontend admin-frontend payment-service notification-service; do
              echo "── hadolint ${f}/Dockerfile ──"
              docker run --rm -i hadolint/hadolint:v2.15.1-alpine \
                hadolint --no-fail - < "${f}/Dockerfile" || FAILED=1
            done
            exit 0
          displayName: 'Hadolint — Dockerfile lint (report only)'

        - script: |
            set -euo pipefail

            if [ "$(Build.Reason)" = "PullRequest" ]; then
              BASE="origin/$(System.PullRequest.TargetBranch)"
              git fetch --no-tags origin "$(System.PullRequest.TargetBranch)"
              RANGE="${BASE}...HEAD"
            else
              LAST_GOOD=$(curl -fsS -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds?definitions=$(System.DefinitionId)&branchName=refs/heads/main&resultFilter=succeeded&statusFilter=completed&queryOrder=finishTimeDescending&\$top=1&api-version=7.1" \
                | jq -r '.value[0].sourceVersion // empty' 2>/dev/null || true)

              if [ -n "$LAST_GOOD" ] && git cat-file -e "${LAST_GOOD}^{commit}" 2>/dev/null; then
                echo "Diffing against last successful main build: ${LAST_GOOD}"
                RANGE="${LAST_GOOD}..HEAD"
              elif git rev-parse HEAD~1 >/dev/null 2>&1; then
                echo "No usable last successful build — diffing against HEAD~1"
                RANGE="HEAD~1..HEAD"
              else
                RANGE=""
              fi
            fi

            if [ -z "$RANGE" ]; then
              CHANGED="ALL"
            else
              CHANGED=$(git diff --name-only $RANGE)
            fi
            echo "Changed files:"; echo "$CHANGED"

            if echo "$CHANGED" | grep -qE '^(azure-pipelines\.yml|\.azuredevops/)' || [ "$CHANGED" = "ALL" ] || [ "$(Build.Reason)" = "Manual" ]; then
              FORCE_ALL=true
            else
              FORCE_ALL=false
            fi

            for svc in backend admin-backend frontend admin-frontend payment-service notification-service; do
              VAR="changed_$(echo $svc | tr '-' '_')"
              if [ "$FORCE_ALL" = "true" ] || echo "$CHANGED" | grep -q "^${svc}/"; then
                echo "  ${svc}: CHANGED"
                echo "##vso[task.setvariable variable=${VAR};isOutput=true]true"
              else
                echo "  ${svc}: unchanged — will be skipped"
                echo "##vso[task.setvariable variable=${VAR};isOutput=true]false"
              fi
            done

            SHA=$(git rev-parse --short=12 HEAD)
            echo "##vso[task.setvariable variable=imageTag;isOutput=true]${SHA}"
            echo "##vso[task.setvariable variable=commitCreated;isOutput=true]$(git show -s --format=%cI HEAD)"
            echo "Image tag for this run: ${SHA}"
          name: detect
          displayName: 'Detect changed services + compute image tag'
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)

        - publish: '$(Build.ArtifactStagingDirectory)'
          artifact: 'static-analysis-reports'
          condition: always()
          displayName: 'Publish SARIF reports'

- stage: Validate
  displayName: '2. Validate Services'
  dependsOn: Static
  condition: succeeded()
  jobs:
    - ${{ each service in parameters.services }}:
        - job: Validate_${{ replace(service.name, '-', '_') }}
          displayName: 'Validate ${{ service.name }}'
          timeoutInMinutes: 15
          condition: eq(stageDependencies.Static.Changes.outputs['detect.changed_${{ replace(service.name, '-', '_') }}'], 'true')
          steps:
            - template: .azuredevops/templates/validate-service.yml
              parameters:
                name: ${{ service.name }}
                path: ${{ service.path }}
                hasBuild: ${{ service.hasBuild }}
                hasLint: ${{ service.hasLint }}
                hasTests: ${{ service.hasTests }}
                nodeVersion: $(nodeVersion)
                trivyVersion: $(trivyVersion)

- stage: Package
  displayName: '3. Build, Scan & Push'
  dependsOn:
    - Static
    - Validate
  condition: succeeded()
  jobs:
    - ${{ each service in parameters.services }}:
        - job: Package_${{ replace(service.name, '-', '_') }}
          displayName: 'Package ${{ service.name }}'
          timeoutInMinutes: 25
          condition: eq(stageDependencies.Static.Changes.outputs['detect.changed_${{ replace(service.name, '-', '_') }}'], 'true')
          variables:
            imageTag: $[ stageDependencies.Static.Changes.outputs['detect.imageTag'] ]
            commitCreated: $[ stageDependencies.Static.Changes.outputs['detect.commitCreated'] ]
          steps:
            - template: .azuredevops/templates/package-service.yml
              parameters:
                name: ${{ service.name }}
                path: ${{ service.path }}
                acrLoginServer: $(acrLoginServer)
                imageNamespace: $(imageNamespace)
                imageTag: $(imageTag)
                commitCreated: $(commitCreated)
                trivyVersion: $(trivyVersion)
                syftVersion: $(syftVersion)

- stage: Promote
  displayName: '4. Promote to GitOps'
  dependsOn:
    - Static
    - Package
  condition: and(succeeded(), eq(variables['isMain'], 'True'))
  jobs:
    - job: Promote
      displayName: 'Bump image tags in Gitops_Homeease'
      timeoutInMinutes: 10
      variables:
        imageTag: $[ stageDependencies.Static.Changes.outputs['detect.imageTag'] ]
        changed_backend: $[ stageDependencies.Static.Changes.outputs['detect.changed_backend'] ]
        changed_admin_backend: $[ stageDependencies.Static.Changes.outputs['detect.changed_admin_backend'] ]
        changed_frontend: $[ stageDependencies.Static.Changes.outputs['detect.changed_frontend'] ]
        changed_admin_frontend: $[ stageDependencies.Static.Changes.outputs['detect.changed_admin_frontend'] ]
        changed_payment_service: $[ stageDependencies.Static.Changes.outputs['detect.changed_payment_service'] ]
        changed_notification_service: $[ stageDependencies.Static.Changes.outputs['detect.changed_notification_service'] ]
      steps:
        - checkout: none

        - script: |
            set -euo pipefail
            echo "Installing yq $(yqVersion)"
            curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/v$(yqVersion)/yq_linux_amd64"
            chmod +x /usr/local/bin/yq
            yq --version
          displayName: 'Install yq'

        - script: |
            set -euo pipefail

            if [ -z "${GITOPS_PAT:-}" ]; then
              echo "##vso[task.logissue type=error]GITOPS_PAT is not set. Add it as a secret variable in the homeease-ci variable group (see .azuredevops/README.md)."
              exit 1
            fi

            echo "GitOps repo:   $(gitopsRepo)"
            echo "GitOps branch: $(gitopsBranch)"

            if ! git ls-remote --exit-code \
                 "https://x-access-token:${GITOPS_PAT}@$(gitopsRepo)" \
                 "refs/heads/$(gitopsBranch)" > /tmp/ls-remote.out 2>/tmp/ls-remote.err; then
              echo "##vso[task.logissue type=error]Could not authenticate to $(gitopsRepo) / see refs/heads/$(gitopsBranch) with GITOPS_PAT. This is a token/permissions problem, not a pipeline bug — check the PAT's expiry, its Contents:write scope on Gitops_Homeease, and (for fine-grained tokens) whether it still needs org/repo approval."
              cat /tmp/ls-remote.err
              exit 1
            fi
            echo "Auth check passed — $(gitopsBranch) is reachable with GITOPS_PAT."

            WORKDIR=$(mktemp -d)
            git clone --depth 1 --branch "$(gitopsBranch)" \
              "https://x-access-token:${GITOPS_PAT}@$(gitopsRepo)" \
              "$WORKDIR/gitops"
            cd "$WORKDIR/gitops"
            git config user.name "homeease-ci"
            git config user.email "homeease-ci@users.noreply.github.com"

            declare -A CHANGED=(
              [backend]="$(changed_backend)"
              [admin-backend]="$(changed_admin_backend)"
              [frontend]="$(changed_frontend)"
              [admin-frontend]="$(changed_admin_frontend)"
              [payment-service]="$(changed_payment_service)"
              [notification-service]="$(changed_notification_service)"
            )

            BUMPED=()
            for svc in "${!CHANGED[@]}"; do
              if [ "${CHANGED[$svc]}" = "true" ]; then
                VALUES_FILE="charts/${svc}/values-azure-dev.yaml"
                if [ ! -f "$VALUES_FILE" ]; then
                  echo "##vso[task.logissue type=error]${VALUES_FILE} not found — chart layout may have changed."
                  exit 1
                fi
                CURRENT_TAG=$(yq '.image.tag' "$VALUES_FILE")
                if [ "$CURRENT_TAG" = "$(imageTag)" ]; then
                  echo "${svc}: already at $(imageTag), nothing to do"
                  continue
                fi
                yq -i '.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"
                echo "${svc}: ${CURRENT_TAG} -> $(imageTag)"
                BUMPED+=("$svc")
              fi
            done

            if [ ${#BUMPED[@]} -eq 0 ]; then
              echo "Nothing to promote — no changed service is behind $(imageTag)."
              DEV_COMMIT=$(git rev-parse HEAD)
              echo "##vso[task.setvariable variable=devCommit;isOutput=true]${DEV_COMMIT}"
              exit 0
            fi

            echo "----- git diff (GitOps values files only) -----"
            git --no-pager diff -- charts/*/values-azure-dev.yaml
            echo "------------------------------------------------"

            git add charts/*/values-azure-dev.yaml
            SERVICE_LIST=$(IFS=', '; echo "${BUMPED[*]}")
            git commit -m "$(printf 'ci: update %s image to %s\n\nSource: SrinidhiSanjeevi/app_Homeease@%s\nBuild: %s' "$SERVICE_LIST" "$(imageTag)" "$(Build.SourceVersion)" "$(Build.BuildId)")"

            if ! git push origin "HEAD:$(gitopsBranch)" 2>/tmp/push.err; then
              cat /tmp/push.err
              if grep -qi "protected branch\|required status check\|pull request" /tmp/push.err; then
                echo "##vso[task.logissue type=error]Push rejected by a GitHub branch protection rule on $(gitopsBranch). Check Gitops_Homeease > Settings > Branches: either allow the GITOPS_PAT identity to bypass required-PR/status-check rules, or note that this branch requires promotion via PR (a workflow change, out of scope for this pipeline)."
              elif grep -qi "403\|authentication failed\|invalid username or token" /tmp/push.err; then
                echo "##vso[task.logissue type=error]Push rejected by GitHub authentication/authorization. Re-check GITOPS_PAT expiry and its Contents:write scope on Gitops_Homeease."
              elif grep -qi "non-fast-forward\|fetch first\|rejected" /tmp/push.err; then
                echo "##vso[task.logissue type=error]$(gitopsBranch) moved on the remote after this job cloned it (e.g. a concurrent manual promotion). Re-run the pipeline rather than force-pushing over it."
              else
                echo "##vso[task.logissue type=error]git push to $(gitopsRepo) failed for an unrecognized reason — see the error above."
              fi
              exit 1
            fi

            DEV_COMMIT=$(git rev-parse HEAD)
            echo "##vso[task.setvariable variable=devCommit;isOutput=true]${DEV_COMMIT}"
            echo "DEV desired state is now Gitops_Homeease@${DEV_COMMIT}"
          name: bump
          displayName: 'Bump image.tag + push'
          env:
            GITOPS_PAT: $(GITOPS_PAT)
            IMAGE_TAG: $(imageTag)

- stage: DevVerify
  displayName: '5. Verify DEV'
  dependsOn:
    - Promote
  condition: and(succeeded(), eq(variables['isMain'], 'True'))
  jobs:
    - job: Verify
      displayName: 'Wait for DEV rollout + smoke test'
      timeoutInMinutes: 25
      variables:
        devCommit: $[ stageDependencies.Promote.Promote.outputs['bump.devCommit'] ]
      steps:
        - checkout: none

        - script: |
            set -euo pipefail
            curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/v$(yqVersion)/yq_linux_amd64"
            chmod +x /usr/local/bin/yq
            yq --version
          displayName: 'Install yq'

        - script: |
            set -euo pipefail

            if [ -z "${DEV_COMMIT:-}" ]; then
              echo "##vso[task.logissue type=error]Promote did not publish bump.devCommit — cannot tell which DEV state to verify."
              exit 1
            fi

            WORKDIR=$(mktemp -d)
            git clone --quiet --depth 1 --branch "$(gitopsBranch)" \
              "https://x-access-token:${GITOPS_PAT}@$(gitopsRepo)" "$WORKDIR/gitops"
            cd "$WORKDIR/gitops"
            git fetch --quiet --depth 1 origin "$DEV_COMMIT"
            devval() { git show "${DEV_COMMIT}:charts/$1/values-azure-dev.yaml" | yq "$2"; }

            BACKEND_HOST=$(devval backend '.ingress.host')
            BACKEND_TAG=$(devval backend '.image.tag')
            FRONTEND_HOST=$(devval frontend '.ingress.host')
            ADMIN_FRONTEND_HOST=$(devval admin-frontend '.ingress.host')
            echo "Verifying DEV at Gitops_Homeease@${DEV_COMMIT} (backend expected at ${BACKEND_TAG})"

            DEADLINE=$(( $(date +%s) + 15 * 60 ))

            while :; do
              BODY=$(curl -sk --max-time 10 "https://${BACKEND_HOST}/health/live" || true)
              VERSION=$(echo "$BODY" | jq -r '.version // empty' 2>/dev/null || true)
              if [ "$VERSION" = "$BACKEND_TAG" ]; then
                echo "backend is serving ${BACKEND_TAG}"
                break
              fi
              if { [ -z "$VERSION" ] && echo "$BODY" | jq -e '.status == "ok"' >/dev/null 2>&1; } || [ "$VERSION" = "unknown" ]; then
                echo "##vso[task.logissue type=warning]backend /health/live does not report a version yet — rollout of ${BACKEND_TAG} NOT confirmed, only health is checked."
                break
              fi
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "##vso[task.logissue type=error]DEV backend still reports version '${VERSION:-unreachable}', expected ${BACKEND_TAG}. Check the backend-dev Application in Argo CD (sync status, pod events). This pipeline has no cluster access to check itself — most common cause on this cluster is the pod stuck Pending on node CPU pressure with cluster-autoscaler blocked by the subscription's regional core quota (kubectl describe pod / az monitor activity-log on the node resource group will show it)."
                exit 1
              fi
              echo "  backend reports '${VERSION:-unreachable}', waiting..."
              sleep 15
            done

            wait_for_200() {
              local url="$1"
              while :; do
                CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
                if [ "$CODE" = "200" ]; then echo "OK   ${url}"; return 0; fi
                if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                  echo "##vso[task.logissue type=error]${url} returned ${CODE:-no response}, expected 200."
                  return 1
                fi
                echo "  ${url} -> ${CODE:-no response}, waiting..."
                sleep 10
              done
            }

            wait_for_200 "https://${BACKEND_HOST}/health/ready"
            wait_for_200 "https://${FRONTEND_HOST}/"
            wait_for_200 "https://${ADMIN_FRONTEND_HOST}/"

            echo "DEV verified at Gitops_Homeease@${DEV_COMMIT}"
          displayName: 'Verify DEV rollout + health'
          env:
            GITOPS_PAT: $(GITOPS_PAT)
            DEV_COMMIT: $(devCommit)

- stage: Report
  displayName: '6. Publish CI Metrics'
  dependsOn:
    - Static
    - Validate
    - Package
    - Promote
    - DevVerify
  condition: always()
  jobs:
    - job: Metrics
      displayName: 'Push CI metrics to Pushgateway'
      timeoutInMinutes: 5
      steps:
        - checkout: none
        - script: |
            set -uo pipefail

            curl -fsSL -H "Authorization: Bearer $(System.AccessToken)" \
              "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/timeline?api-version=7.1" \
              -o timeline.json || { echo "timeline fetch failed"; exit 0; }

            STATUS=$(jq -r '[.records[] | select(.type=="Stage") | .result] | if index("failed") then 0 else 1 end' timeline.json)

            {
              echo "# TYPE ci_pipeline_result gauge"
              echo "ci_pipeline_result ${STATUS}"
              echo "# TYPE ci_pipeline_last_run_timestamp gauge"
              echo "ci_pipeline_last_run_timestamp $(date +%s)"

              jq -r '.records[]
                | select(.type=="Job" and .startTime != null and .finishTime != null)
                | "\(.name)|\(((.finishTime|fromdateiso8601) - (.startTime|fromdateiso8601)))"' timeline.json \
              | while IFS='|' read -r NAME DUR; do
                  SAFE=$(echo "$NAME" | tr -c 'a-zA-Z0-9_' '_')
                  echo "# TYPE ci_job_duration_seconds gauge"
                  echo "ci_job_duration_seconds{job_name=\"${SAFE}\"} ${DUR}"
                done
            } > metrics.txt

            cat metrics.txt

            curl -fsS --max-time 10 --data-binary @metrics.txt \
              "$(PUSHGATEWAY_URL)/metrics/job/homeease_ci/pipeline/azure_devops" \
              || echo "Pushgateway unreachable — metrics dropped, build unaffected"
            exit 0
          displayName: 'Emit ci_job_duration_seconds'
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          continueOnError: true

- ${{ if eq(variables.enableStagingPromotion, 'true') }}:
  - stage: PromoteStaging
    displayName: '7a. Promote to STAGING (preview, approval)'
    dependsOn:
      - Promote
      - DevVerify
    condition: and(succeeded(), eq(variables['isMain'], 'True'))
    jobs:
      - template: .azuredevops/templates/promotion-demo.yml
        parameters:
          targetName: STAGING
          environment: homeease-staging
          valuesFile: values-azure-staging.yaml
          dryRun: true

  - stage: PromoteProdDemo
    displayName: '7c. Promote to PROD (preview, approval)'
    dependsOn:
      - Promote
      - PromoteStaging
    condition: and(succeeded(), eq(variables['isMain'], 'True'))
    jobs:
      - template: .azuredevops/templates/promotion-demo.yml
        parameters:
          targetName: PROD
          environment: homeease-prod
          valuesFile: values-azure-prod.yaml
          dryRun: true

- ${{ if eq(variables.enableProdPromotion, 'true') }}:
  - stage: PromoteProd
    displayName: '7. Promote to PROD (approval required)'
    dependsOn:
      - Promote
      - DevVerify
    condition: and(succeeded(), eq(variables['isMain'], 'True'))
    lockBehavior: runLatest
    variables:
      - group: homeease-prod-gitops
    jobs:
      - deployment: PromoteProd
        displayName: 'Copy verified DEV tags to PROD values'
        environment: homeease-prod
        timeoutInMinutes: 10
        variables:
          devCommit: $[ stageDependencies.Promote.Promote.outputs['bump.devCommit'] ]
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none

                - script: |
                    set -euo pipefail
                    curl -fsSL -o /usr/local/bin/yq \
                      "https://github.com/mikefarah/yq/releases/download/v$(yqVersion)/yq_linux_amd64"
                    chmod +x /usr/local/bin/yq
                    yq --version
                  displayName: 'Install yq'

                - script: |
                    set -euo pipefail

                    if [ -z "${GITOPS_PROD_PAT:-}" ]; then
                      echo "##vso[task.logissue type=error]GITOPS_PROD_PAT is not set. Add it to the homeease-prod-gitops variable group (see .azuredevops/README.md). GITOPS_PAT is deliberately NOT used as a fallback."
                      exit 1
                    fi
                    if [ -z "${DEV_COMMIT:-}" ]; then
                      echo "##vso[task.logissue type=error]No verified DEV commit from the Promote stage — refusing to promote."
                      exit 1
                    fi

                    WORKDIR=$(mktemp -d)
                    git clone --quiet --depth 1 --branch "$(gitopsBranch)" \
                      "https://x-access-token:${GITOPS_PROD_PAT}@$(gitopsRepo)" "$WORKDIR/gitops"
                    cd "$WORKDIR/gitops"
                    git fetch --quiet --depth 1 origin "$DEV_COMMIT"
                    git config user.name "homeease-ci"
                    git config user.email "homeease-ci@users.noreply.github.com"

                    BUMPED=()
                    STALE=()
                    for svc in backend admin-backend frontend admin-frontend payment-service notification-service; do
                      DEV_FILE="charts/${svc}/values-azure-dev.yaml"
                      PROD_FILE="charts/${svc}/values-azure-prod.yaml"
                      if [ ! -f "$PROD_FILE" ]; then
                        echo "##vso[task.logissue type=error]${PROD_FILE} not found — PROD values must exist before promotion."
                        exit 1
                      fi

                      VERIFIED_TAG=$(git show "${DEV_COMMIT}:${DEV_FILE}" | yq '.image.tag')
                      VERIFIED_REPO=$(git show "${DEV_COMMIT}:${DEV_FILE}" | yq '.image.repository')
                      CURRENT_DEV_TAG=$(yq '.image.tag' "$DEV_FILE")
                      PROD_REPO=$(yq '.image.repository' "$PROD_FILE")
                      PROD_TAG=$(yq '.image.tag' "$PROD_FILE")

                      if ! [[ "$VERIFIED_TAG" =~ ^[0-9a-f]{12}$ ]]; then
                        echo "##vso[task.logissue type=error]${svc}: DEV tag '${VERIFIED_TAG}' is not a 12-char commit SHA — refusing to promote it."
                        exit 1
                      fi
                      if [ "$VERIFIED_REPO" != "$PROD_REPO" ]; then
                        echo "##vso[task.logissue type=error]${svc}: PROD image.repository (${PROD_REPO}) differs from DEV (${VERIFIED_REPO}) — PROD would not run the verified image."
                        exit 1
                      fi
                      if [ "$CURRENT_DEV_TAG" != "$VERIFIED_TAG" ]; then
                        STALE+=("${svc}: verified ${VERIFIED_TAG}, DEV is now ${CURRENT_DEV_TAG}")
                        continue
                      fi
                      if [ "$PROD_TAG" = "$VERIFIED_TAG" ]; then
                        echo "${svc}: PROD already at ${VERIFIED_TAG}"
                        continue
                      fi
                      NEW_TAG="$VERIFIED_TAG" yq -i '.image.tag = strenv(NEW_TAG)' "$PROD_FILE"
                      echo "${svc}: PROD ${PROD_TAG} -> ${VERIFIED_TAG}"
                      BUMPED+=("$svc")
                    done

                    if [ ${#STALE[@]} -gt 0 ]; then
                      printf '  %s\n' "${STALE[@]}"
                      echo "##vso[task.logissue type=error]DEV has moved on since this run verified it. Promoting now would push older images to PROD — approve the newest run instead."
                      exit 1
                    fi
                    if [ ${#BUMPED[@]} -eq 0 ]; then
                      echo "Nothing to promote — PROD already matches verified DEV."
                      exit 0
                    fi

                    echo "----- git diff (PROD values files only) -----"
                    git --no-pager diff -- charts/*/values-azure-prod.yaml
                    echo "---------------------------------------------"

                    git add charts/*/values-azure-prod.yaml
                    SERVICE_LIST=$(IFS=', '; echo "${BUMPED[*]}")
                    git commit -m "$(printf 'ci(prod): promote %s to prod\n\nVerified DEV state: Gitops_Homeease@%s\nSource: SrinidhiSanjeevi/app_Homeease@%s\nBuild: %s\nApproved via Azure DevOps environment homeease-prod' "$SERVICE_LIST" "$DEV_COMMIT" "$(Build.SourceVersion)" "$(Build.BuildId)")"

                    if ! git push origin "HEAD:$(gitopsBranch)" 2>/tmp/push.err; then
                      cat /tmp/push.err
                      if grep -qi "non-fast-forward\|fetch first" /tmp/push.err; then
                        echo "##vso[task.logissue type=error]$(gitopsBranch) moved after this job cloned it. Re-run this stage — it re-checks staleness before pushing."
                      else
                        echo "##vso[task.logissue type=error]git push with GITOPS_PROD_PAT failed — check the token's expiry and Contents:write scope on Gitops_Homeease."
                      fi
                      exit 1
                    fi
                    echo "PROD desired state is now Gitops_Homeease@$(git rev-parse HEAD)"
                  displayName: 'Copy verified DEV tags to PROD + push'
                  env:
                    GITOPS_PROD_PAT: $(GITOPS_PROD_PAT)
                    DEV_COMMIT: $(devCommit)
