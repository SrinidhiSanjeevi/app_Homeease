trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*
      - admin-backend/*
      - frontend/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: homeease-secrets
  - name: acrName
    value: 'acrhomeease'
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: sonarProjectKey
    value: 'homeease'

stages:

# ============================================================
# STAGE 1 — CODE QUALITY (gates everything downstream)
# ============================================================
- stage: CodeQuality
  displayName: 'Code Quality Gate'
  jobs:
    - job: SonarQubeScan
      displayName: 'Build, Test & SonarQube Quality Gate'
      steps:
        - task: NodeTool@0
          inputs:
            versionSpec: '22.x'

        - script: |
            cd backend && npm ci --no-audit --no-fund
            cd ../admin-backend && npm ci --no-audit --no-fund
            cd ../frontend && npm ci --no-audit --no-fund && npm run build
          displayName: 'Install & build all services'

        - task: SonarQubePrepare@5
          inputs:
            SonarQube: 'sonarqube-connection'
            scannerMode: 'CLI'
            configMode: 'manual'
            cliProjectKey: '$(sonarProjectKey)'
            cliProjectName: 'HomeEase'
            cliSources: '.'
            extraProperties: |
              sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js
              sonar.cpd.exclusions=**/models/**,**/middleware/**
              sonar.qualitygate.wait=true
              sonar.qualitygate.timeout=300

        - task: SonarQubeAnalyze@5

        # THIS is what was missing — without it, the pipeline never
        # actually blocks on a failed Quality Gate, so "completed"
        # only ever meant "the analysis ran," not "the analysis passed."
        - task: SonarQubePublish@5
          inputs:
            pollingTimeoutSec: '300'

# ============================================================
# STAGE 2 — BUILD, SCAN & PUSH (parallel jobs, ONE stage)
# ============================================================
- stage: BuildAndPush
  displayName: 'Build, Trivy Scan & Push Images'
  dependsOn: CodeQuality
  condition: succeeded()   # never runs if the Quality Gate failed above
  jobs:
    - job: Backend
      steps:
        - task: Docker@2
          inputs:
            command: 'build'
            repository: 'homeease-backend'
            dockerfile: 'backend/Dockerfile'
            buildContext: 'backend'
            tags: '$(imageTag)'
        - script: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed homeease-backend:$(imageTag)
          displayName: 'Trivy scan — backend'
        - task: Docker@2
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'
        - script: |
            docker tag homeease-backend:$(imageTag) $(acrLoginServer)/homeease-backend:$(imageTag)
            docker tag homeease-backend:$(imageTag) $(acrLoginServer)/homeease-backend:latest
            docker push $(acrLoginServer)/homeease-backend:$(imageTag)
            docker push $(acrLoginServer)/homeease-backend:latest
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          displayName: 'Push backend image'

    - job: AdminBackend
      steps:
        - task: Docker@2
          inputs:
            command: 'build'
            repository: 'homeease-admin-backend'
            dockerfile: 'admin-backend/Dockerfile'
            buildContext: 'admin-backend'
            tags: '$(imageTag)'
        - script: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed homeease-admin-backend:$(imageTag)
          displayName: 'Trivy scan — admin-backend'
        - task: Docker@2
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'
        - script: |
            docker tag homeease-admin-backend:$(imageTag) $(acrLoginServer)/homeease-admin-backend:$(imageTag)
            docker tag homeease-admin-backend:$(imageTag) $(acrLoginServer)/homeease-admin-backend:latest
            docker push $(acrLoginServer)/homeease-admin-backend:$(imageTag)
            docker push $(acrLoginServer)/homeease-admin-backend:latest
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          displayName: 'Push admin-backend image'

    - job: Frontend
      steps:
        - task: Docker@2
          inputs:
            command: 'build'
            repository: 'homeease-frontend'
            dockerfile: 'frontend/Dockerfile'
            buildContext: 'frontend'
            tags: '$(imageTag)'
        - script: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed homeease-frontend:$(imageTag)
          displayName: 'Trivy scan — frontend'
        - task: Docker@2
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          inputs:
            command: 'login'
            containerRegistry: 'acr-service-connection'
        - script: |
            docker tag homeease-frontend:$(imageTag) $(acrLoginServer)/homeease-frontend:$(imageTag)
            docker tag homeease-frontend:$(imageTag) $(acrLoginServer)/homeease-frontend:latest
            docker push $(acrLoginServer)/homeease-frontend:$(imageTag)
            docker push $(acrLoginServer)/homeease-frontend:latest
          condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          displayName: 'Push frontend image'